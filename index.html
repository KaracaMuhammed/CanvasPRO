// Builds the block of pictures inside a note + the "Add image" tile at the end
function makeInlineImages(item) {
  const wrap = document.createElement("div");
  (item.images || []).forEach((im, idx) => {
    const box = document.createElement("div"); box.className = "inline-img";
    const img = document.createElement("img"); img.src = imgUrl(im);
    if (im.link) { img.classList.add("linked"); img.title = im.link; }
    img.onclick = () => im.link && window.open(im.link, "_blank", "noopener");   // click = open link
    // Move handle (appears on hover): drag it to reorder, to another note, or out onto the canvas
    const mv = document.createElement("div"); mv.className = "imove"; mv.innerHTML = ICON_GRIP;
    mv.title = "Drag to move: reorder it, put it in another note, or drop it on the canvas";
    enableImageMove(mv, box, img, item, idx, wrap);
    const rm = document.createElement("button"); rm.className = "rm"; rm.textContent = "\u00d7"; rm.title = "Remove image";
    rm.onclick = () => { item.images.splice(idx, 1); save(); render(); };
    const inp = document.createElement("input"); inp.className = "link";
    inp.placeholder = "Link URL for this image"; inp.value = im.link || "";
    inp.onchange = () => { im.link = fixUrl(inp.value); save(); render(); };
    box.append(img, mv, rm, inp); wrap.appendChild(box);
  });
  // The "Add image" tile: it looks like an empty picture and lights up when you hover over it
  const add = document.createElement("button");
  const left = (addUntil[item.id] || 0) - Date.now();      // time left while the field is open (0 or less = closed)
  add.className = "addpic" + (item.images && item.images.length ? " compact" : "") + (left > 0 ? "" : " closed");
  add.innerHTML = ICON_IMAGE + "<span>Add image</span><span class='sub'>click, paste or drop a file</span><i></i>";   // <i> = the countdown line
  if (left > 0) add.querySelector("i").style.animationDuration = left + "ms";
  add.title = "Add an image inside this note";
  add.onmousedown = e => e.preventDefault();   // same reason: keep the focus, so the click is never lost
  add.onclick = () => { pendingNote = item; file.click(); };
  // While the pointer is over the field it stays open (the countdown pauses); the 5 seconds restart when you leave it
  add.onmouseenter = () => { clearTimeout(addTimers[item.id]); add.querySelector("i").style.animationPlayState = "paused"; };
  add.onmouseleave = () => { if (!add.classList.contains("closed")) setAddField(item, true); };
  wrap.appendChild(add);
  return wrap;
}

// Drag a picture by its handle. A small ghost copy follows the pointer (the note would clip the real one).
//  - dropped inside the same note  -> it changes place (a blue line shows where)
//  - dropped on another note       -> it moves into that note
//  - dropped on the empty canvas   -> it becomes its own image card, where you let go
function enableImageMove(handle, box, imgEl, item, idx, wrap) {
  handle.onpointerdown = e => {
    if (e.button !== 0) return;
    e.preventDefault(); e.stopPropagation();
    handle.setPointerCapture(e.pointerId);
    const card = box.closest(".card"), others = [...wrap.querySelectorAll(".inline-img")], rest = others.filter(o => o !== box);
    const ghost = imgEl.cloneNode(); ghost.className = "ghost"; document.body.appendChild(ghost);
    box.style.opacity = ".35";
    const cardAt = m => { const el = document.elementFromPoint(m.clientX, m.clientY); return el && el.closest(".card"); };
    const itemOf = c => c && items.find(i => i.id === c.dataset.id);
    // index the picture would get inside this note: how many of the others are above the pointer
    const slot = m => rest.filter(o => { const r = o.getBoundingClientRect(); return m.clientY > r.top + r.height / 2; }).length;
    const clearMarks = () => {
      others.forEach(o => o.classList.remove("ins-before", "ins-after"));
      document.querySelectorAll(".card.dropping").forEach(c => c.classList.remove("dropping"));
    };
    const cleanup = () => { handle.onpointermove = handle.onpointerup = handle.onpointercancel = null; ghost.remove(); clearMarks(); box.style.opacity = ""; };

    handle.onpointermove = m => {
      ghost.style.left = m.clientX + 12 + "px"; ghost.style.top = m.clientY + 12 + "px";
      clearMarks();
      const c = cardAt(m), t = itemOf(c);
      if (t === item && rest.length) { const k = slot(m); if (k < rest.length) rest[k].classList.add("ins-before"); else rest[k - 1].classList.add("ins-after"); }
      else if (t && t !== item && t.type === "note") c.classList.add("dropping");
    };
    handle.onpointercancel = cleanup;
    handle.onpointerup = m => {
      const sr = scroller.getBoundingClientRect(), t = itemOf(cardAt(m)), k = slot(m);
      cleanup();
      if (m.clientX < sr.left || m.clientX > sr.right || m.clientY < sr.top || m.clientY > sr.bottom) return;   // released outside the canvas: cancel
      const im = item.images[idx];
      if (t === item) { item.images.splice(idx, 1); item.images.splice(k, 0, im); }                          // reorder
      else if (t && t.type === "note") { item.images.splice(idx, 1); (t.images = t.images || []).push(im); }   // into another note
      else {                                                                                                   // out onto the canvas
        if (itemLimitReached()) return;                                                                        // Free plan limit
        item.images.splice(idx, 1);
        const [bx, by] = toBoard(m.clientX, m.clientY);
        items.push({ id: uid(), type: "image", x: snap(bx - 40), y: snap(by - 20), w: 240, img: im.img, url: im.url, link: im.link || "", text: "" });
      }
      save(); render();
    };
  };
}

/* =====================================================================
   DEADLINES (premium)
   - item.deadline : the due moment as a number (ms since 1970), optional
   - item.dlStart  : when the deadline was set, used to fill the progress ring
   The chip shows a ring that fills as time runs out, a live "time left"
   text, and the date. Click it to open a popover with quick presets.
   ===================================================================== */
const DAY = 864e5;
const RING = 2 * Math.PI * 9;        // circumference of the ring (radius 9, see the SVG below)

// Turns a duration in ms into short text: "45 min", "5h 20m", "3d 4h", "3 weeks"
function spanText(ms) {
  const m = Math.floor(ms / 6e4);
  if (m < 1) return "<1 min";
  if (m < 60) return m + " min";
  const h = Math.floor(m / 60);
  if (h < 24) return h + "h " + (m % 60) + "m";
  const d = Math.floor(h / 24);
  if (d < 14) return d + "d " + (h % 24) + "h";
  return Math.round(d / 7) + " weeks";
}

// Works out what the chip should show right now: color state, ring fill (0-1) and text
function dlInfo(item) {
  if (!item.deadline) return { cls: "none", pct: 0, text: "Add deadline" };
  if (item.done)      return { cls: "done", pct: 1, text: "\u2713 Completed" };
  const now = Date.now(), left = item.deadline - now;
  const start = item.dlStart || now;
  const pct = Math.min(1, Math.max(0, (now - start) / Math.max(1, item.deadline - start)));
  if (left < 0) return { cls: "late", pct: 1, text: "Overdue " + spanText(-left) };
  let cls = pct < 0.5 ? "ok" : pct < 0.8 ? "warn" : "hot";   // green -> amber -> orange
  if (left < 2 * 36e5) cls = "hot";                          // under 2 hours is always "hot"
  return { cls, pct, text: spanText(left) + " left" };
}

const fmtDate = ms => new Date(ms).toLocaleString(undefined, { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
// Value format that <input type="datetime-local"> expects (local time)
const toLocalInput = ms => new Date(ms - new Date().getTimezoneOffset() * 6e4).toISOString().slice(0, 16);
// A moment N days from now at hh:mm (used by the presets)
function at(daysAhead, h, m) { const d = new Date(); d.setDate(d.getDate() + daysAhead); d.setHours(h, m, 0, 0); return d.getTime(); }

// Builds the footer of a note: the deadline chip
function makeDeadline(item, card) {
  const foot = document.createElement("div"); foot.className = "foot";
  const chip = document.createElement("button");
  chip.innerHTML = '<svg class="ring" viewBox="0 0 24 24"><circle class="track" cx="12" cy="12" r="9"/>' +
                   '<circle class="bar" cx="12" cy="12" r="9" stroke-dasharray="' + RING + '"/></svg>' +
                   '<span class="t"></span><span class="d"></span>';
  const bar = chip.querySelector(".bar"), t = chip.querySelector(".t"), d = chip.querySelector(".d");

  // paint() refreshes the chip; it is called now and then every 30 seconds
  const paint = () => {
    const i = dlInfo(item);
    chip.className = "dl " + i.cls;
    bar.style.strokeDashoffset = RING * (1 - i.pct);          // ring fill
    t.textContent = i.text;
    d.textContent = item.deadline && i.cls !== "done" ? "\u00b7 " + fmtDate(item.deadline) : "";
    chip.title = item.deadline ? "Deadline: " + fmtDate(item.deadline) + " (click to change)" : "Add a deadline (optional)";
    card.classList.toggle("overdue", i.cls === "late");        // red glow when overdue
  };
  paint(); liveChips.push(paint);

  chip.onmousedown = e => e.preventDefault();   // keeps the text you are typing from losing focus
  chip.onclick = () => openPop(chip, item);
  foot.appendChild(chip);
  return foot;
}

// ----- Popover (one shared element, placed under the clicked chip) -----
const pop = document.createElement("div"); pop.id = "pop"; pop.hidden = true; document.body.appendChild(pop);
let popFor = null;
function closePop() { pop.hidden = true; popFor = null; }
function setDeadline(item, ms) {
  if (ms) { item.deadline = ms; item.dlStart = Date.now(); }
  else    { delete item.deadline; delete item.dlStart; }        // no value = remove the deadline
  save(); closePop(); render();
}
function openPop(chip, item) {
  if (lockedFeature("deadlines")) return;          // Pro feature
  if (popFor === item && !pop.hidden) return closePop();          // clicking the chip again closes it
  popFor = item; pop.innerHTML = "";
  const add = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; pop.appendChild(e); return e; };

  add("div", "ph", "Set a deadline");
  // Quick presets (edit the labels / times here)
  const presets = [
    ["Later today",    () => { const x = at(0, 18, 0); return x > Date.now() + 36e5 ? x : Date.now() + 3 * 36e5; }],
    ["Tomorrow 9:00",  () => at(1, 9, 0)],
    ["In 3 days",      () => at(3, 9, 0)],
    ["Next week",      () => at(7, 9, 0)],
  ];
  const grid = add("div", "pgrid");
  presets.forEach(([label, fn]) => {
    const b = document.createElement("button"); b.textContent = label;
    b.onclick = () => setDeadline(item, fn()); grid.appendChild(b);
  });
  // Custom date + time: a small calendar and a time box (drawn by us, so it matches the rest of the app)
  add("div", "pl", "Pick a date & time");
  const start = new Date(item.deadline || Date.now() + DAY);
  let vy = start.getFullYear(), vm = start.getMonth();                         // the month being shown
  let sy = vy, sm = vm, sd = start.getDate();                                  // the chosen day
  const cal = add("div", "cal");
  const head = document.createElement("div"); head.className = "calhead"; cal.appendChild(head);
  const prevB = document.createElement("button"); prevB.type = "button"; prevB.textContent = "‹"; prevB.title = "Previous month";
  const nextB = document.createElement("button"); nextB.type = "button"; nextB.textContent = "›"; nextB.title = "Next month";
  const mLbl = document.createElement("span"); head.append(prevB, mLbl, nextB);
  const wk = document.createElement("div"); wk.className = "calgrid wk"; cal.appendChild(wk);
  ["M", "T", "W", "T", "F", "S", "S"].forEach(x => { const w = document.createElement("span"); w.textContent = x; wk.appendChild(w); });
  const days = document.createElement("div"); days.className = "calgrid"; cal.appendChild(days);
  const paintCal = () => {                                                     // draws the days of the month (called again on every change)
    mLbl.textContent = new Date(vy, vm, 1).toLocaleString(undefined, { month: "long", year: "numeric" });
    days.innerHTML = "";
    const lead = (new Date(vy, vm, 1).getDay() + 6) % 7;                       // empty cells before the 1st (the week starts on Monday)
    for (let i = 0; i < lead; i++) days.appendChild(document.createElement("span"));
    const n = new Date(vy, vm + 1, 0).getDate(), now = new Date();
    for (let d = 1; d <= n; d++) {
      const b = document.createElement("button"); b.type = "button"; b.textContent = d;
      if (d === now.getDate() && vm === now.getMonth() && vy === now.getFullYear()) b.classList.add("today");
      if (d === sd && vm === sm && vy === sy) b.classList.add("pick");
      b.onclick = () => { sy = vy; sm = vm; sd = d; paintCal(); };
      days.appendChild(b);
    }
  };
  prevB.onclick = () => { vm--; if (vm < 0) { vm = 11; vy--; } paintCal(); };
  nextB.onclick = () => { vm++; if (vm > 11) { vm = 0; vy++; } paintCal(); };
  paintCal();
  // time: hours and minutes in two small boxes
  const trow = add("div", "trow");
  const tl = document.createElement("span"); tl.textContent = "Time"; tl.style.color = "var(--muted)"; trow.appendChild(tl);   // label on the left, the boxes on the right
  const hh = document.createElement("input"), mm = document.createElement("input");
  [hh, mm].forEach(x => { x.type = "number"; x.className = "tbox"; });
  hh.min = 0; hh.max = 23; mm.min = 0; mm.max = 59; mm.step = 5;
  hh.value = String(start.getHours()).padStart(2, "0"); mm.value = String(start.getMinutes()).padStart(2, "0");
  const fix = (x, max) => { x.value = String(Math.min(max, Math.max(0, parseInt(x.value, 10) || 0))).padStart(2, "0"); };   // keeps the numbers valid
  hh.onchange = () => fix(hh, 23); mm.onchange = () => fix(mm, 59);
  const colon = document.createElement("b"); colon.textContent = ":";
  const tbox = document.createElement("span"); tbox.className = "tgroup"; tbox.append(hh, colon, mm); trow.appendChild(tbox);
  const ok = add("button", "setbtn", "Set deadline");
  ok.onclick = () => { fix(hh, 23); fix(mm, 59); setDeadline(item, new Date(sy, sm, sd, +hh.value, +mm.value).getTime()); };
  if (item.deadline) { const rm = add("button", "rm2", "Remove deadline"); rm.onclick = () => setDeadline(item, null); }

  // Position under the chip (or above it if there is no room)
  pop.hidden = false;
  const r = chip.getBoundingClientRect();
  let top = r.bottom + 8; if (top + pop.offsetHeight > innerHeight - 8) top = r.top - pop.offsetHeight - 8;
  pop.style.left = Math.max(8, Math.min(r.left, innerWidth - pop.offsetWidth - 8)) + "px";
  pop.style.top = Math.max(8, top) + "px";
}

/* ---------- YouTube previews ---------- */
// Matches youtube.com/watch?v=ID, youtu.be/ID, /shorts/ID, /embed/ID and /live/ID (an ID is 11 characters)
const YT_RE = /(?:https?:\/\/)?(?:www\.|m\.)?(?:youtube\.com\/(?:watch\?(?:[^\s]*&)?v=|shorts\/|embed\/|live\/)|youtu\.be\/)([\w-]{11})/g;
function makeVideos(item) {
  const wrap = document.createElement("div");
  if (ACCOUNT && (ACCOUNT.locked || []).includes("youtube")) {   // Free plan: no preview, just a small hint
    if (YT_RE.test(item.text || "")) {
      YT_RE.lastIndex = 0;
      const hint = document.createElement("button"); hint.className = "ytlock"; hint.textContent = "\u25B6 Video preview \u00b7 Pro \u00b7 see how it looks";
      // same side margins as a real preview (10px), so the banner never touches the card border
      hint.style.cssText = "display:block;width:calc(100% - 20px);margin:2px 10px 10px;background:none;border:1px dashed var(--border);color:var(--muted);border-radius:8px;padding:9px 10px;cursor:pointer;font:inherit;font-size:12.5px;text-align:center";
      hint.onclick = e => { e.stopPropagation(); showUpgrade("youtube"); };
      wrap.appendChild(hint);
    }
    YT_RE.lastIndex = 0; return wrap;
  }
  const ids = [...new Set([...(item.text || "").matchAll(YT_RE)].map(m => m[1]))];   // unique video ids found in the text
  ids.forEach(id => {
    const a = document.createElement("a");                       // the whole preview is a link: click = open the video
    a.className = "yt"; a.href = "https://www.youtube.com/watch?v=" + id;
    a.target = "_blank"; a.rel = "noopener"; a.title = "Open video on YouTube";
    const img = document.createElement("img");
    img.src = "https://img.youtube.com/vi/" + id + "/hqdefault.jpg"; img.alt = "";
    // If the thumbnail can't load (offline, blocked...), show a plain dark box instead
    img.onerror = () => { img.remove(); const fb = document.createElement("span"); fb.className = "fb"; fb.textContent = "YouTube video"; a.prepend(fb); };
    const play = document.createElement("span"); play.className = "play";   // red play button drawn by CSS
    a.append(img, play); wrap.appendChild(a);
  });
  return wrap;
}

/* ---------- Dragging (mouse + touch via pointer events) ---------- */
function enableDrag(el, handle, item) {
  handle.onpointerdown = e => {
    if (e.button !== 0 || e.target.closest("button, input")) return;   // closest() also catches clicks on the icon drawn INSIDE a button
    if (e.shiftKey) { e.preventDefault(); toggleSelItem(item.id); return; }   // Shift+click on the header: add to / remove from the selection
    handle.setPointerCapture(e.pointerId);
    const many = sel.items.has(item.id) && sel.items.size + sel.strokes.size > 1;
    if (many) return startGroupDrag(e, handle);                        // part of a selection: everything selected moves together
    if (!sel.items.has(item.id)) clearSel();                           // dragging something that is not selected: forget the selection
    const sx = e.clientX, sy = e.clientY, ox = item.x, oy = item.y;   // where the drag started
    handle.onpointermove = m => {
      item.x = snap(Math.max(MINPOS, ox + (m.clientX - sx) / zoom)); item.y = snap(Math.max(MINPOS, oy + (m.clientY - sy) / zoom)); layoutStage();   // / zoom: screen pixels -> canvas pixels; snap() = jump to the nearest dot when enabled
      el.style.left = item.x + "px"; el.style.top = item.y + "px";
    };
    handle.onpointerup = () => { handle.onpointermove = handle.onpointerup = null; save(); };
  };
}

// Builds a smooth SVG path from a list of points (curves through the midpoints)

// Does the point (x, y) touch this stroke? (distance from the point to each little segment)

/* =====================================================================
   ZOOM

const stage = document.getElementById("stage"), zoomLbl = document.getElementById("zoomLbl");
let zoom = 1;

// Change the zoom; the point (cx, cy) on the screen stays where it is, so you zoom towards the pointer
function setZoom(z, cx, cy) {

  const sr = scroller.getBoundingClientRect();
  if (cx === undefined) { cx = sr.left + sr.width / 2; cy = sr.top + sr.height / 2; }
  const bx = (scroller.scrollLeft - PAD * zoom + cx - sr.left) / zoom, by = (scroller.scrollTop - PAD * zoom + cy - sr.top) / zoom;   // canvas point under the cursor
  zoom = z;

  scroller.scrollLeft = PAD * zoom + bx * zoom - (cx - sr.left); scroller.scrollTop = PAD * zoom + by * zoom - (cy - sr.top);

document.getElementById("zoomIn").onclick = () => setZoom(zoom * 1.2);
document.getElementById("zoomOut").onclick = () => setZoom(zoom / 1.2);

/* =====================================================================
   FREE TEXT  (a card of type "text": just text on the canvas, no frame)

function addText(x, y) {

  x = x ?? viewX() + (60 + Math.random() * 80) / zoom;
  y = y ?? viewY() + (60 + Math.random() * 80) / zoom;
  const item = { id: uid(), type: "text", x: snap(x), y: snap(y), w: 260, text: "", size: 22 };
  items.push(item); save(); render(item.id);            // opens the editor right away
}
document.getElementById("addText").onclick = () => addText();

/* =====================================================================
   DELETE WITH A 5-SECOND UNDO
   The card disappears at once, a message with an Undo button stays for 5 seconds.
   Its pictures are protected (keep) until the time is over, then cleaned up.
   ===================================================================== */
const toasts = document.createElement("div"); toasts.id = "toasts"; document.body.appendChild(toasts);
function toast(msg, actionLabel, ms, onAction, onExpire) {
  const t = document.createElement("div"); t.className = "toast";
  const m = document.createElement("span"); m.textContent = msg;
  const b = document.createElement("button"); b.textContent = actionLabel;
  const bar = document.createElement("i"); bar.style.animationDuration = ms + "ms";   // the shrinking line = time left
  t.append(m, b, bar); toasts.appendChild(t);
  const me = { fire: () => b.click() };
  if (actionLabel === "Undo") undoToast = me;           // remember it, so Ctrl+Z can use it (see undo())
  const gone = () => { if (undoToast === me) undoToast = null; };
  const timer = setTimeout(() => { t.remove(); gone(); if (onExpire) onExpire(); }, ms);
  b.onclick = () => { clearTimeout(timer); t.remove(); gone(); onAction(); };
}
function removeItem(item) {
  const index = items.indexOf(item);
  items.splice(index, 1);
  const ids = [item.img, ...(item.images || []).map(m => m.img)].filter(Boolean);
  ids.forEach(id => keep.add(id));                      // keep its pictures while undo is possible
  save(); render();
  toast("Deleted", "Undo", 5000,
    () => { items.splice(Math.min(index, items.length), 0, item); save(); render(); },   // undo: put it back where it was
    () => { ids.forEach(id => keep.delete(id)); save(); });                              // time is over: the clean-up may delete the pictures

/* =====================================================================
   PASTE and DROP pictures anywhere on the canvas
   - Ctrl+V with a screenshot, "Copy image" from a web page, or an image link
   - dragging an image file (or an image from another web page) onto the canvas
   The picture lands under the pointer. While you type in a note, a pasted image goes inside that note.
   ===================================================================== */
const IMG_URL_RE = /^https?:\/\/\S+\.(png|jpe?g|gif|webp|avif|svg)(\?\S*)?$/i;

function pasteSpot() {                                  // under the pointer if it is over the canvas, else top-left of the view
  const sr = scroller.getBoundingClientRect(), c = lastClient;
  if (c && c[0] > sr.left && c[0] < sr.right && c[1] > sr.top && c[1] < sr.bottom) return toBoard(c[0], c[1]);

  const txt = (dt.getData("text/uri-list") || dt.getData("text/plain") || "").trim();

    else { const r = await fetch(url); if (!r.ok) throw new Error("download failed"); blob = await r.blob(); }

    try {                                                // (only if the browser already allows reading the clipboard: no surprise question)

    } catch (e2) {}
    toast("Only the link of this picture could be kept (the site does not allow copying it). Tip: right-click the picture → Copy image, or take a screenshot.", "OK", 9000, () => {});

    const target = activeNote && activeNote.type === "note" ? activeNote : null, blob = await fileToBlob(f);   // only notes can hold pictures inside
    return target ? addImageToNote(target, blob) : addImage(blob, x, y);

/* =====================================================================

   - Left side "v7": shows the version you are on and opens the list (15 per page).
     Click a row to go back to it (this does NOT create a new version; Undo stays for 5 seconds).
   - Automatic copies are added every 2 minutes, but only if you changed something. The 12 newest are kept.

const curSnap = () => snaps.find(sn => sn.id === curId);

// The label on the left button: the version you are on (a * means you edited the canvas since)
function updateSplit() {

  listBtn.title = c ? "You are on version " + c.n + (sameAs(c) ? "" : " (edited since)") + ". Click to see all saved versions." : "Version history: go back to an earlier version, or delete versions";

async function persistSnaps() {

}
// ===== ACCOUNT / PLAN (only active when served by the Canvas PRO server) =====

}

}
async function postJson(url, body) {

  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || "Something went wrong.");
  return d;
}

async function saveSlot(auto) {
  const match = [curSnap(), snaps[0]].find(sn => sn && sameAs(sn));   // is this exact canvas already saved?
  if (match) {                                          // yes: no duplicate
    curId = match.id;
    if (!auto && match.auto) match.auto = false;        // a manual Save keeps an automatic copy for good
    await persistSnaps(); return;
  }
  const n = Math.max(0, ...snaps.map(sn => sn.n || 0)) + 1;
  const sn = { id: uid(), n, date: Date.now(), auto: !!auto, items: clone(items), strokes: clone(strokes) };
  snaps.unshift(sn); curId = sn.id;
  if (auto) snaps.filter(x => x.auto).slice(12).forEach(x => snaps.splice(snaps.indexOf(x), 1));   // keep the 12 newest automatic copies
  if (isFree() && snaps.length > ACCOUNT.limits.versions) { snaps.length = ACCOUNT.limits.versions; if (curId && !snaps.some(x => x.id === curId)) curId = sn.id; }   // Free plan: newest versions only
  listPage = 0;                                         // a new save: the list goes back to the top
  await persistSnaps();
  if (!listPanel.hidden) { renderList(); listPanel.scrollTop = 0; }
}
// Go back to a version. No new version is created; Undo (5 s) returns to what you had.
function restoreSlot(sn) {
  const before = { items: clone(items), strokes: clone(strokes), curId };
  const ids = imageIds(before.items); ids.forEach(id => keep.add(id));      // protect its pictures while Undo is possible
  items = clone(sn.items); strokes = clone(sn.strokes); curId = sn.id;
  persistSnaps(); drawAll(); render(); closeList();
  toast("Back to version " + sn.n, "Undo", 5000,
    () => { items = before.items; strokes = before.strokes; curId = before.curId; persistSnaps(); drawAll(); render(); },
    () => { ids.forEach(id => keep.delete(id)); save(); });
}
async function deleteSlot(id) {
  snaps = snaps.filter(sn => sn.id !== id);
  if (curId === id) curId = null;
  await persistSnaps(); renderList();
}
// Remove every version older than the one you are on (or older than the newest, if you are on none)
function removeOlder() {
  const i = Math.max(0, snaps.findIndex(sn => sn.id === curId));
  const gone = snaps.slice(i + 1);
  if (!gone.length) return;
  const ids = imageIds(gone.flatMap(sn => sn.items)); ids.forEach(id => keep.add(id));
  snaps = snaps.slice(0, i + 1); listPage = 0;
  persistSnaps(); renderList();
  toast("Removed " + gone.length + " older version" + (gone.length > 1 ? "s" : ""), "Undo", 5000,
    () => { snaps = snaps.concat(gone); persistSnaps(); renderList(); },    // they were older than everything left, so they go back at the end
    () => { ids.forEach(id => keep.delete(id)); save(); });
}

const listPanel = document.createElement("div"); listPanel.id = "snapList"; listPanel.hidden = true; document.body.appendChild(listPanel);
function closeList() { listPanel.hidden = true; }
const countImgs = sn => sn.items.reduce((n, i) => n + (i.type === "image" ? 1 : 0) + (i.images ? i.images.length : 0), 0);
function renderList() {
  listPanel.innerHTML = "";
  const add = (tag, cls, text, parent = listPanel) => { const e = document.createElement(tag); e.className = cls; if (text) e.textContent = text; parent.appendChild(e); return e; };
  const head = add("div", "sh", "");
  add("span", "", "Version history", head);
  const older = snaps.length - 1 - Math.max(0, snaps.findIndex(sn => sn.id === curId));
  if (older > 0) {                                      // the small "remove older versions" button
    const rm = add("button", "srm", "Remove " + older + " older", head);
    rm.title = "Delete every version older than the one you are on (Undo for 5 seconds)";
    rm.onclick = removeOlder;
  }
  if (!snaps.length) add("div", "empty", "Nothing saved yet. Press Save to keep a copy of your canvas.");
  const pages = Math.max(1, Math.ceil(snaps.length / PAGE));
  listPage = Math.min(listPage, pages - 1);
  snaps.slice(listPage * PAGE, listPage * PAGE + PAGE).forEach(sn => {
    const here = sn.id === curId;
    const row = add("div", "srow" + (here ? " cur" : ""), "");
    const go = add("button", "sgo", "", row);
    const top = add("span", "top", "", go);
    add("span", "", "v" + sn.n + " \u00b7 " + (sn.auto ? "Auto \u00b7 " : "") + fmtDate(sn.date), top);
    if (here) add("em", "badge", sameAs(sn) ? "\u25cf YOU ARE HERE" : "\u25cf YOU ARE HERE (edited)", top);
    add("small", "", sn.items.filter(i => i.type === "note").length + " notes \u00b7 " + countImgs(sn) + " images \u00b7 " + sn.strokes.length + " drawings", go);
    go.onclick = () => restoreSlot(sn);
    const del = add("button", "sdel", "\u00d7", row); del.title = "Delete this version";
    let timer = null;
    del.onclick = () => {                               // two clicks: the first arms the button, the second deletes
      if (!timer) {
        del.textContent = "Delete?"; del.classList.add("armed");
        timer = setTimeout(() => { del.textContent = "\u00d7"; del.classList.remove("armed"); timer = null; }, 2000);
        return;
      }
      clearTimeout(timer); deleteSlot(sn.id);
    };
  });
  if (pages > 1) {                                      // paging: 15 versions per page
    const nav = add("div", "spage", "");
    const prev = add("button", "", "\u2039 Newer", nav), next = add("button", "", "Older \u203a", nav);
    add("span", "", (listPage * PAGE + 1) + "\u2013" + Math.min(snaps.length, (listPage + 1) * PAGE) + " of " + snaps.length, nav);
    nav.insertBefore(nav.lastChild, next);              // order: Newer | 1-15 of 42 | Older
    prev.disabled = listPage === 0; next.disabled = listPage >= pages - 1;
    prev.onclick = () => { listPage--; renderList(); listPanel.scrollTop = 0; };
    next.onclick = () => { listPage++; renderList(); listPanel.scrollTop = 0; };
  }
}

/* =====================================================================
   PAN: hold the middle mouse button (click the scroll wheel) and move the mouse,
   the canvas follows your hand from the point where you pressed.
   ===================================================================== */
let pan = null;
scroller.addEventListener("mousedown", e => { if (e.button === 1) e.preventDefault(); });   // stops the browser's own auto-scroll circle
scroller.addEventListener("pointerdown", e => {
  if (e.button !== 1) return;
  e.preventDefault();
  pan = { x: e.clientX, y: e.clientY, left: scroller.scrollLeft, top: scroller.scrollTop };   // where the hand started
  scroller.setPointerCapture(e.pointerId); scroller.style.cursor = "grabbing";
});
scroller.addEventListener("pointermove", e => {
  if (!pan) return;
  scroller.scrollLeft = pan.left - (e.clientX - pan.x); scroller.scrollTop = pan.top - (e.clientY - pan.y);
});
const endPan = () => { pan = null; scroller.style.cursor = ""; };
scroller.addEventListener("pointerup", endPan); scroller.addEventListener("pointercancel", endPan);

/* =====================================================================
   SELECT AND MOVE (notes, pictures, free text AND drawings)
   - Drag on an empty part of the canvas: a rectangle selects everything it touches (notes, pictures, text, drawings).
   - Click a drawing to select it. Shift+click on a note's header (or on a drawing) adds / removes it.
   - Drag the header of a selected note, or a selected drawing: the whole selection moves together.
   - Delete / Backspace removes the selection (Undo for 5 seconds). Ctrl+A selects all. Esc clears the selection.
   (In draw mode the rectangle is off, because the pen uses the mouse.)
   ===================================================================== */
const sel = { items: new Set(), strokes: new Set() };    // ids of the selected cards and drawings
function applySel() {                                    // show the selection: outline on cards, glow on drawings
  board.querySelectorAll(".card").forEach(c => c.classList.toggle("sel", sel.items.has(c.dataset.id)));
  drawAll();
  updatePdfBtn();                                        // the PDF button says when it will export only the selection
}
function clearSel() { if (!sel.items.size && !sel.strokes.size) return; sel.items.clear(); sel.strokes.clear(); applySel(); }
function toggleSelItem(id) { sel.items.has(id) ? sel.items.delete(id) : sel.items.add(id); applySel(); }
function toggleSelStroke(id) { sel.strokes.has(id) ? sel.strokes.delete(id) : sel.strokes.add(id); applySel(); }

// Move everything that is selected while the pointer moves (captureEl = the element that follows the pointer)
function startGroupDrag(e, captureEl) {
  const sx = e.clientX, sy = e.clientY;
  const its = items.filter(i => sel.items.has(i.id)).map(i => ({ i, x: i.x, y: i.y }));
  const sts = strokes.filter(st => sel.strokes.has(st.id)).map(st => ({ st, pts: st.pts.map(p => [p[0], p[1]]) }));
  let minX = Infinity, minY = Infinity;                  // so nothing is pushed out of the canvas on the left / top
  its.forEach(o => { minX = Math.min(minX, o.x); minY = Math.min(minY, o.y); });
  sts.forEach(o => o.pts.forEach(([x, y]) => { minX = Math.min(minX, x); minY = Math.min(minY, y); }));
  captureEl.onpointermove = m => {
    let dx = (m.clientX - sx) / zoom, dy = (m.clientY - sy) / zoom;
    if (snapOn) { dx = Math.round(dx / GRID) * GRID; dy = Math.round(dy / GRID) * GRID; }
    dx = Math.max(dx, -minX); dy = Math.max(dy, -minY);
    its.forEach(o => {
      o.i.x = o.x + dx; o.i.y = o.y + dy;
      const c = board.querySelector('.card[data-id="' + o.i.id + '"]');
      if (c) { c.style.left = o.i.x + "px"; c.style.top = o.i.y + "px"; }
    });
    if (sts.length) { sts.forEach(o => { o.st.pts = o.pts.map(([x, y]) => [x + dx, y + dy]); }); drawAll(); }
  };
  captureEl.onpointerup = captureEl.onpointercancel = () => { captureEl.onpointermove = captureEl.onpointerup = captureEl.onpointercancel = null; save(); };
}

const marq = document.createElement("div"); marq.id = "marquee"; board.appendChild(marq);   // the selection rectangle
stage.addEventListener("pointerdown", e => {
  if ((e.target !== board && e.target !== stage) || drawOn || e.button !== 0) return;       // only on the empty canvas, not on a card, not while drawing
  const [x, y] = toBoard(e.clientX, e.clientY);
  const hit = [...strokes].reverse().find(st => hitStroke(st, x, y));   // did you press on a drawing?
  board.setPointerCapture(e.pointerId);
  if (hit) {
    if (e.shiftKey) { toggleSelStroke(hit.id); return; }
    if (!sel.strokes.has(hit.id)) { sel.items.clear(); sel.strokes.clear(); sel.strokes.add(hit.id); applySel(); }
    return startGroupDrag(e, board);
  }
  if (!e.shiftKey) clearSel();                                       // empty canvas: start a rectangle (Shift keeps the old selection)
  let moved = false;
  board.onpointermove = m => {
    const [cx, cy] = toBoard(m.clientX, m.clientY), w = Math.abs(cx - x), h = Math.abs(cy - y);
    if (w + h > 4) moved = true;
    Object.assign(marq.style, { display: "block", left: Math.min(x, cx) + "px", top: Math.min(y, cy) + "px", width: w + "px", height: h + "px" });
  };
  board.onpointerup = m => {
    board.onpointermove = board.onpointerup = null; marq.style.display = "none";
    if (!moved) return;
    const [cx, cy] = toBoard(m.clientX, m.clientY);
    const L = Math.min(x, cx), T = Math.min(y, cy), R = Math.max(x, cx), B = Math.max(y, cy);
    board.querySelectorAll(".card").forEach(c => {                    // every card the rectangle touches
      const it = items.find(i => i.id === c.dataset.id);
      if (it && it.x < R && it.x + c.offsetWidth > L && it.y < B && it.y + c.offsetHeight > T) sel.items.add(it.id);
    });
    strokes.forEach(st => {                                           // every drawing whose box the rectangle touches
      let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
      outline(st).forEach(([px, py]) => { x1 = Math.min(x1, px); y1 = Math.min(y1, py); x2 = Math.max(x2, px); y2 = Math.max(y2, py); });
      if (x1 < R && x2 > L && y1 < B && y2 > T) sel.strokes.add(st.id);
    });
    applySel();
  };
});

function removeSelected() {                              // Delete key: removes the selection, Undo for 5 seconds
  const its = items.filter(i => sel.items.has(i.id)), sts = strokes.filter(st => sel.strokes.has(st.id));
  if (!its.length && !sts.length) return;
  const itAt = its.map(i => items.indexOf(i)), stAt = sts.map(st => strokes.indexOf(st));
  const ids = its.flatMap(i => [i.img, ...(i.images || []).map(m => m.img)]).filter(Boolean);
  ids.forEach(id => keep.add(id));                       // keep their pictures while Undo is possible
  items = items.filter(i => !sel.items.has(i.id)); strokes = strokes.filter(st => !sel.strokes.has(st.id));
  sel.items.clear(); sel.strokes.clear();
  save(); drawAll(); render();
  toast("Deleted " + (its.length + sts.length) + (its.length + sts.length > 1 ? " things" : " thing"), "Undo", 5000,
    () => {                                              // undo: put everything back where it was
      its.forEach((it, k) => items.splice(Math.min(itAt[k], items.length), 0, it));
      sts.forEach((st, k) => strokes.splice(Math.min(stAt[k], strokes.length), 0, st));
      save(); drawAll(); render();
    },
    () => { ids.forEach(id => keep.delete(id)); save(); });
}
document.addEventListener("keydown", e => {
  const ae = document.activeElement;
  if (ae && (ae.tagName === "INPUT" || ae.tagName === "TEXTAREA" || ae.isContentEditable)) return;   // typing: leave the keys alone
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") { e.preventDefault(); e.shiftKey ? redo() : undo(); }     // undo / redo
  else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "y") { e.preventDefault(); redo(); }
  else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "a") {
    e.preventDefault(); items.forEach(i => sel.items.add(i.id)); strokes.forEach(st => sel.strokes.add(st.id)); applySel();
  } else if (e.key === "Delete" || e.key === "Backspace") {
    if (sel.items.size || sel.strokes.size) { e.preventDefault(); removeSelected(); }
  } else if (e.key === "Escape") clearSel();
});

/* =====================================================================
   HIGHLIGHT TEXT IN NOTES
   While you edit a note, select some text: a small colour bar appears above the note. Pick a colour to highlight it.
   In the text it is stored as  ==y:highlighted words==  (y = yellow, g = green, b = blue, p = pink, o = orange).
   The note view hides the marks and shows the colour. The ✕ button removes the highlight.
   ===================================================================== */
const HL_COLORS = { y: "#ffd60a", g: "#34c759", b: "#0a84ff", p: "#ff6b9d", o: "#ff9f0a" };
const HL_SRC = "==([ygbpo]):(.+?)==";                   // used with new RegExp(HL_SRC, "g")

/* =====================================================================
   FILE ON YOUR COMPUTER (File System Access API: Chrome, Edge, Opera)
   - "Save to a new file...": you choose the place ONCE, then every change is written there automatically.
   - "Open a saved file...": continue from a file (your current canvas is first kept as a version).
   - The file holds everything: notes, pictures, drawing and saved versions. Open it later to restore.
   - When the page starts, the file is compared with the browser copy: the NEWER one wins.
     So an old tab can never overwrite newer work: the file always has the latest.
   - The browser may ask you to click "reconnect" once per visit (it forgets the permission).
   ===================================================================== */
const FS_OK = "showSaveFilePicker" in window && "showOpenFilePicker" in window;

let fileHandle = null, fileNeedsPermission = false, fileErr = "", fileTimer = null, fileBusy = false;
const dataCache = new Map();                           // picture id -> data URL (so each picture is converted only once)
const blobToDataUrl = b => new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(b); });
const fileBtn = document.getElementById("fileBtn");
const FILE_TYPES = [{ description: "Canvas Todo", accept: { "application/json": [".json"] } }];

function updateFileBtn() {
  fileBtn.classList.toggle("on", !!fileHandle && !fileNeedsPermission && !fileErr);
  if (!FS_OK) { fileBtn.innerHTML = HI.folder; fileBtn.title = "Backing up to a file needs Chrome, Edge or Opera"; return; }
  if (!fileHandle) { fileBtn.innerHTML = HI.folder; fileBtn.title = "Optional: also keep a backup copy in a file on your computer. It updates by itself after you choose where."; return; }
  fileBtn.innerHTML = HI.folder + "<span>" + fileHandle.name.replace(/[<>&]/g, "") + "</span><b class='fok'>" + (fileNeedsPermission ? "reconnect" : fileErr ? "\u26a0" : HI.link) + "</b>";
  fileBtn.title = fileNeedsPermission ? "Click to allow saving to this file again"
                : fileErr ? "Problem with the file: " + fileErr : "Saving automatically to " + fileHandle.name;
}
// Everything in one text: the cards, drawing, versions and every picture (as text, once each)
async function buildFileText() {
  const ids = new Set();
  const mark = i => { if (i.img) ids.add(i.img); (i.images || []).forEach(m => m.img && ids.add(m.img)); };
  items.forEach(mark); snaps.forEach(sn => sn.items.forEach(mark));
  const images = {};
  for (const id of ids) {
    if (!dataCache.has(id)) { try { dataCache.set(id, await blobToDataUrl(await dbGet("images", id))); } catch (e) {} }
    if (dataCache.has(id)) images[id] = dataCache.get(id);
  }
  return JSON.stringify({ app: "canvas-todo", version: 3, rev: myRev, savedAt: new Date().toISOString(), items, strokes, snaps, curId, images });

async function writeFile() {
  if (!fileHandle) return;
  if (fileBusy) return queueFileWrite();                // a write is running: try again shortly
  fileBusy = true;
  try {
    if ((await fileHandle.queryPermission({ mode: "readwrite" })) !== "granted") { fileNeedsPermission = true; return; }
    const w = await fileHandle.createWritable();
    await w.write(await buildFileText()); await w.close();
    fileNeedsPermission = false; fileErr = "";
  } catch (e) { fileErr = e.name === "NotFoundError" ? "file missing" : String(e.message || e); }
  finally { fileBusy = false; updateFileBtn(); }
}
function queueFileWrite() { if (!fileHandle) return; clearTimeout(fileTimer); fileTimer = setTimeout(writeFile, 1500); }

  try { const d = JSON.parse(await (await handle.getFile()).text()); return d && Array.isArray(d.items) ? d : null; }
  catch (e) { return null; }                           // empty or not a Canvas Todo file
}
// Replace the canvas with the content of a file (pictures go back into the browser storage)
async function applyFileData(data) {
  for (const [id, url] of Object.entries(data.images || {})) {
    if (urlCache[id]) continue;
    const blob = dataUrlToBlob(url);
    await dbPut("images", id, blob); urlCache[id] = URL.createObjectURL(blob); dataCache.set(id, url);
  }

// Compare the file with the browser copy: the newer one wins
async function syncWithFile() {
  try {
    const data = await readFileData(fileHandle);
    if (data && (data.rev || 0) > myRev) { await applyFileData(data); setStatus("Loaded newer data from your file ✓"); }
    else await writeFile();
    fileErr = "";
  } catch (e) { fileErr = e.name === "NotFoundError" ? "file missing" : String(e.message || e); }

}
async function initFile() {                            // called when the page starts
  if (!FS_OK || !db) return updateFileBtn();
  try { fileHandle = (await dbGet("kv", "fileHandle")) || null; } catch (e) { fileHandle = null; }
  if (fileHandle) {
    try {
      if ((await fileHandle.queryPermission({ mode: "readwrite" })) === "granted") await syncWithFile();

/* =====================================================================
   PDF EXPORT  (one page with the whole canvas, like Apple Freeform)
   1) buildPrintRoot() copies every card and drawing into a hidden #printRoot, in light colours, moved to the top-left corner.
   2) A temporary @page rule gives the page exactly the size of the content (no page breaks, no scaling).
   3) window.print() opens the browser's print window: choose "Save as PDF" as the printer.
   ===================================================================== */
const pdfBtn = document.getElementById("pdfBtn");
pdfBtn.innerHTML = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M12 11v6m-3-3 3 3 3-3"/></svg><span>PDF</span>';
function buildPrintRoot() {
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();   // finish any text being edited first
  // Something selected (drag a rectangle on the canvas)? Then only that part is exported. Nothing selected: everything.
  const part = sel.items.size + sel.strokes.size > 0;
  const useCard = c => !part || sel.items.has(c.dataset.id), useStroke = st => !part || sel.strokes.has(st.id);
  let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
  board.querySelectorAll(".card").forEach(c => {
    if (!useCard(c)) return;
    x1 = Math.min(x1, c.offsetLeft); y1 = Math.min(y1, c.offsetTop); x2 = Math.max(x2, c.offsetLeft + c.offsetWidth); y2 = Math.max(y2, c.offsetTop + c.offsetHeight);
  });
  strokes.forEach(st => { if (useStroke(st)) (st.pts || []).forEach(([px, py]) => { x1 = Math.min(x1, px - 6); y1 = Math.min(y1, py - 6); x2 = Math.max(x2, px + 6); y2 = Math.max(y2, py + 6); }); });
  if (x1 === Infinity) return null;                                    // nothing to export
  const m = 40, W = Math.ceil(x2 - x1 + 2 * m), H = Math.ceil(y2 - y1 + 2 * m);
  document.getElementById("printRoot")?.remove(); document.getElementById("printPage")?.remove();
  const root = document.createElement("div"); root.id = "printRoot";
  // light colours whatever the screen theme is
  root.style.cssText = "--bg:#fff;--card:#fff;--text:#26241f;--muted:#8a867b;--accent:#2f64e0;--link:#2f64e0;--border:#e2ded2;--dot:#d9d5c9;color-scheme:light;color:#26241f;background:#fff;position:relative;overflow:hidden;width:" + W + "px;height:" + H + "px;font:16px/1.4 system-ui,sans-serif";
  const stageEl = document.createElement("div");                        // moves everything so the content starts at (margin, margin)
  stageEl.style.cssText = "position:absolute;left:" + (m - x1) + "px;top:" + (m - y1) + "px;width:3000px;height:2000px";
  const inkCopy = ink.cloneNode(true); inkCopy.removeAttribute("class"); inkCopy.style.cssText = "position:absolute;left:" + (-PAD) + "px;top:" + (-PAD) + "px;width:" + board.style.getPropertyValue("--layer-w") + ";height:" + board.style.getPropertyValue("--layer-h") + ";overflow:visible";
  inkCopy.querySelectorAll(".sel").forEach(n => n.classList.remove("sel"));
  [...inkCopy.children].forEach((pathNode, i) => { if (strokes[i] && !useStroke(strokes[i])) pathNode.remove(); });   // keep only the wanted drawings (paths are in the same order as strokes)
  const cards = [...board.querySelectorAll(".card")].filter(useCard).map(c => {
    const k = c.cloneNode(true); k.classList.remove("sel");
    k.querySelectorAll(".acts, input.link, .addpic, .linkonly").forEach(n => n.remove());       // buttons and fields are not part of the picture
    const it = items.find(i => i.id === c.dataset.id);
    if (it && (it.type === "image" || it.type === "text")) k.querySelectorAll(".grip").forEach(n => n.remove());   // pictures and free text: no header bar
    k.style.resize = "none"; return k;
  });
  // drawing behind or in front of the cards, as on screen
  if (drawFront) { cards.forEach(k => stageEl.appendChild(k)); stageEl.appendChild(inkCopy); } else { stageEl.appendChild(inkCopy); cards.forEach(k => stageEl.appendChild(k)); }
  root.appendChild(stageEl); document.body.appendChild(root);
  const pg = document.createElement("style"); pg.id = "printPage"; pg.textContent = "@page { size: " + W + "px " + H + "px; margin: 0; }"; document.head.appendChild(pg);
  return { W, H };
}
function exportPdf() {
  if (lockedFeature("pdf")) return;                                    // Pro feature
  const r = buildPrintRoot();
  if (!r) return toast("The canvas is empty: nothing to export.", "OK", 3000);
  window.addEventListener("afterprint", () => { document.getElementById("printRoot")?.remove(); document.getElementById("printPage")?.remove(); }, { once: true });
  setTimeout(() => window.print(), 150);                                // a moment for the copied pictures to load
}
pdfBtn.onclick = exportPdf;
function updatePdfBtn() {

// A page cannot write to your disk by itself: the browser requires that YOU choose the place once, with a click.
// So when no file is linked, a small bar offers it right at the start. Once chosen, auto-save to the file is on for good.
function offerFile() {
  if (!FS_OK || fileHandle) return;

  const bar = document.createElement("div"); bar.id = "fileOffer";

  const yes = document.createElement("button"); yes.textContent = "Choose a backup file"; yes.className = "yes";

let hdb = null;

// Draws a small picture of the canvas (cards, pictures and drawings) and returns it as a JPEG text
/* ---------- The preview picture of a canvas (shown on the home screen) ----------
   makeThumb() first tries to take a REAL picture of the canvas: the cards and drawings are copied, put in an SVG <foreignObject> together with the
   page's own CSS, and drawn into a <canvas>. So the preview looks exactly like the canvas (colours, checkboxes, bold, highlights, pictures).
   If the browser does not allow that, it falls back to the simple drawing below (makeThumbSimple). */
async function makeThumb() {
  try { const t = await makeThumbDom(); if (t) return t; } catch (e) { console.warn("Preview: using the simple drawing", e); }
  return makeThumbSimple();
}
async function makeThumbDom() {
  let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
  board.querySelectorAll(".card").forEach(c => {
    x1 = Math.min(x1, c.offsetLeft); y1 = Math.min(y1, c.offsetTop); x2 = Math.max(x2, c.offsetLeft + c.offsetWidth); y2 = Math.max(y2, c.offsetTop + c.offsetHeight);
  });
  strokes.forEach(st => (st.pts || []).forEach(([px, py]) => { x1 = Math.min(x1, px - 6); y1 = Math.min(y1, py - 6); x2 = Math.max(x2, px + 6); y2 = Math.max(y2, py + 6); }));
  if (x1 === Infinity) return "";                                    // empty canvas: no picture
  const W = 800, H = 500, M = 28;                                    // picture size (shown smaller, so it stays sharp) and the margin inside it
  const k = Math.min((W - 2 * M) / Math.max(1, x2 - x1), (H - 2 * M) / Math.max(1, y2 - y1), 1.6);   // small canvases are shown a bit bigger so they stay readable
  const ox = (W - (x2 - x1) * k) / 2 - x1 * k, oy = (H - (y2 - y1) * k) / 2 - y1 * k;
  const root = getComputedStyle(document.documentElement), bodyCs = getComputedStyle(document.body);
  const wrap = document.createElement("div");                        // the colours of the current theme are copied, so it looks the same as on screen
  wrap.style.cssText = "width:" + W + "px;height:" + H + "px;overflow:hidden;position:relative;font-family:" + bodyCs.fontFamily + ";font-size:" + bodyCs.fontSize + ";line-height:" + bodyCs.lineHeight + ";"
    + ["--bg", "--dot", "--card", "--text", "--muted", "--accent", "--link", "--border"].map(v => v + ":" + root.getPropertyValue(v)).join(";") + ";background:" + bodyCs.backgroundColor + ";color:" + bodyCs.color;
  // (no grid dots in the preview: the home screen shows the content only, whatever the snap setting is)
  const inner = document.createElement("div"); inner.id = "board";   // same id as the real board, so the same CSS rules apply to the copies
  inner.style.cssText = "position:absolute;left:" + ox + "px;top:" + oy + "px;width:3000px;height:2000px;transform-origin:0 0;transform:scale(" + k + ");background:none";
  const inkCopy = ink.cloneNode(true); inkCopy.setAttribute("class", ""); inkCopy.querySelectorAll(".sel").forEach(n => n.setAttribute("class", ""));
  inkCopy.style.cssText = "position:absolute;left:" + (-PAD) + "px;top:" + (-PAD) + "px;width:" + board.style.getPropertyValue("--layer-w") + ";height:" + board.style.getPropertyValue("--layer-h") + ";overflow:visible";
  const cards = [...board.querySelectorAll(".card")].map(c => {
    const kc = c.cloneNode(true); kc.classList.remove("sel"); kc.style.resize = "none"; return kc;
  });
  if (drawFront) { cards.forEach(c => inner.appendChild(c)); inner.appendChild(inkCopy); } else { inner.appendChild(inkCopy); cards.forEach(c => inner.appendChild(c)); }
  // pictures: an SVG picture cannot load other files, so local pictures are turned into data addresses; web pictures (YouTube) are left out
  const toData = blob => new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => res(""); r.readAsDataURL(blob); });
  for (const im of inner.querySelectorAll("img")) {
    if (/^(blob|data):/.test(im.src)) { try { im.src = await toData(await (await fetch(im.src)).blob()); } catch (e) { im.removeAttribute("src"); } }
    else im.removeAttribute("src");
  }
  wrap.appendChild(inner);
  const css = [...document.styleSheets].map(sh => { try { return [...sh.cssRules].map(r => r.cssText).join("\n"); } catch (e) { return ""; } }).join("\n");   // the page's own style rules
  const style = document.createElement("style"); style.textContent = css; wrap.prepend(style);
  const xhtml = new XMLSerializer().serializeToString(wrap);
  const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="' + W + '" height="' + H + '"><foreignObject x="0" y="0" width="100%" height="100%">' + xhtml + '</foreignObject></svg>';
  const img = new Image();
  await new Promise((res, rej) => { img.onload = res; img.onerror = () => rej(new Error("preview image failed")); img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg); });
  const c = document.createElement("canvas"); c.width = W; c.height = H;
  c.getContext("2d").drawImage(img, 0, 0, W, H);
  return c.toDataURL("image/jpeg", 0.85);                            // throws if the browser blocks it -> the caller uses the simple drawing
}
// The simple version (fallback): boxes and a few lines of text
function makeThumbSimple() {
  const W = 480, H = 300, PAD = 16, z = zoom || 1;
  const br = board.getBoundingClientRect();
  const boxes = [...board.querySelectorAll(".card")].map(el => {
    const r = el.getBoundingClientRect();
    return { el, x: (r.left - br.left) / z, y: (r.top - br.top) / z, w: r.width / z, h: r.height / z };
  });
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  const grow = (x, y) => { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); };
  boxes.forEach(b => { grow(b.x, b.y); grow(b.x + b.w, b.y + b.h); });
  strokes.forEach(st => st.pts.forEach(p => grow(p[0], p[1])));
  if (x0 > x1) return "";                                  // empty canvas: no picture
  const k = Math.min((W - 2 * PAD) / Math.max(1, x1 - x0), (H - 2 * PAD) / Math.max(1, y1 - y0), 1.5);   // scale to fit
  const ox = (W - (x1 - x0) * k) / 2 - x0 * k, oy = (H - (y1 - y0) * k) / 2 - y0 * k;
  const c = document.createElement("canvas"); c.width = W; c.height = H;
  const g = c.getContext("2d"), cs = e => getComputedStyle(e);
  g.fillStyle = cs(document.body).backgroundColor; g.fillRect(0, 0, W, H);
  // drawings
  g.save(); g.translate(ox, oy); g.scale(k, k); g.lineCap = "round"; g.lineJoin = "round"; g.fillStyle = "none";
  strokes.forEach(st => { try { g.strokeStyle = st.color; g.lineWidth = st.size; g.stroke(new Path2D(strokeD(st))); } catch (e) {} });
  g.restore();
  // cards
  for (const b of boxes) {
    const el = b.el, x = ox + b.x * k, y = oy + b.y * k, w = b.w * k, h = b.h * k, st = cs(el);
    const free = el.classList.contains("free");
    if (!free) {
      g.fillStyle = st.backgroundColor; g.strokeStyle = cs(document.body).getPropertyValue("--border") || "#ccc"; g.lineWidth = 1;
      g.beginPath(); g.roundRect ? g.roundRect(x, y, w, h, 4) : g.rect(x, y, w, h); g.fill(); g.stroke();
    }
    el.querySelectorAll("img").forEach(im => {             // only local pictures: web pictures would block saving the preview
      if (!/^(blob|data):/.test(im.src) || !im.naturalWidth) return;
      const r = im.getBoundingClientRect();
      try { g.drawImage(im, ox + (r.left - br.left) / z * k, oy + (r.top - br.top) / z * k, r.width / z * k, r.height / z * k); } catch (e) {}
    });
    const body = el.querySelector(".body");                // text: a few lines, just enough to recognise the note
    if (body && body.innerText.trim()) {
      const fs = Math.max(6, parseFloat(cs(body).fontSize) * k);
      g.font = fs + "px Inter, system-ui, sans-serif"; g.fillStyle = cs(body).color; g.textBaseline = "top";
      let ty = y + 4 * k + (free ? 0 : 20 * k);
      for (const line of body.innerText.split("\n")) {
        if (ty + fs > y + h) break;
        let t = line; while (t.length > 1 && g.measureText(t).width > w - 8 * k) t = t.slice(0, -1);
        g.fillText(t, x + 5 * k, ty); ty += fs * 1.35;
      }
    }
  }
  try { return c.toDataURL("image/jpeg", 0.8); } catch (e) { return ""; }
}

let metaTimer = null, metaRev = -1;

async function updateMeta(force) {

  try {
    const cur = await metaGet(CANVAS_ID); if (!cur) return;    // deleted from the home screen meanwhile: do not bring it back
    metaRev = myRev;
    cur.thumb = await makeThumb(); cur.count = items.length + strokes.length; cur.updated = force && !cur.thumb ? cur.updated : Date.now();
    meta = cur; await metaPut(cur);
  } catch (e) {}

  if (!hdb) return;
  try { const cur = (await metaGet(CANVAS_ID)) || meta; cur.name = canvasName.value.trim() || "Untitled canvas"; canvasName.value = cur.name; meta = cur; await metaPut(cur); document.title = cur.name + " – Canvas PRO"; } catch (e) {}
};

// ---- the home screen ----
const ago = t => {
  const m = Math.round((Date.now() - t) / 60000);
  if (m < 1) return "just now"; if (m < 60) return m + " min ago";
  const h = Math.round(m / 60); if (h < 24) return h + " h ago";

async function showHome() {

  [...document.body.children].forEach(el => { if (el.tagName !== "SCRIPT") el.style.display = "none"; });   // hide the canvas screen

    #home .wrap { max-width: 1080px; margin: 0 auto; }
    #home .brand { display: flex; justify-content: center; color: var(--text); margin-bottom: 44px; }
    #home .brand svg { height: 40px; width: auto; }
    #home .head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--border); padding-bottom: 12px; margin-bottom: 26px; }
    #home h1 { font-size: 13px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 0; }
    #home .sub { font-size: 13px; color: var(--muted); margin: 0; }

    .cv .shot { aspect-ratio: 8 / 5; border-radius: 14px; border: 1px solid var(--border); background: var(--card) center / cover no-repeat; cursor: pointer;
      display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 13px; overflow: hidden;
      box-shadow: 0 1px 2px rgba(0,0,0,.05); transition: transform .18s, box-shadow .18s, border-color .18s; }
    .cv .shot.blank { background: var(--bg); }          /* an empty canvas: plain background, no dots */
    .cv .shot:hover { transform: translateY(-3px); border-color: var(--accent); box-shadow: 0 12px 28px rgba(0,0,0,.14); }
    .cv input { font: inherit; font-size: 15px; font-weight: 600; background: transparent; color: var(--text); border: 1px solid transparent; border-radius: 8px;
      padding: 3px 8px; margin: 0 -8px; width: calc(100% + 16px); box-sizing: border-box; }
    .cv input:hover { border-color: var(--border); } .cv input:focus { outline: none; border-color: var(--accent); background: var(--card); }
    .cv small { color: var(--muted); font-size: 12.5px; }
    .cv .del { position: absolute; top: 10px; right: 10px; width: 28px; height: 28px; border-radius: 50%; border: 0; background: rgba(0,0,0,.55); color: #fff; cursor: pointer; opacity: 0; transition: opacity .15s; font-size: 13px; line-height: 1; }
    .cv:hover .del { opacity: 1; } @media (hover: none) { .cv .del { opacity: .85; } }
    .cv.new .shot { border: 1.5px dashed var(--border); background: transparent; box-shadow: none; font-size: 14px; flex-direction: column; gap: 4px; }
    .cv.new .shot:hover { color: var(--accent); }
    .cv.new .plus { font-size: 30px; font-weight: 300; line-height: 1; }
    @media (max-width: 560px) { #home { padding: 36px 18px 60px; } #home .brand { margin-bottom: 30px; } #grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 22px 14px; } }`;
  document.head.appendChild(st);
  try { hdb = await homeOpen(); } catch (e) { home.innerHTML = "<h1>Canvas PRO</h1><p class='sub'>⚠ Storage unavailable in this browser.</p>"; return; }

  // The canvas you had before this feature existed shows up as "My canvas"
  let list = await metaAll();
  if (!list.some(m => m.id === "main")) {
    try {
      const names = indexedDB.databases ? (await indexedDB.databases()).map(d => d.name) : ["canvas-todo"];
      if (names.includes("canvas-todo")) {
        const od = await openDb("canvas-todo"); const had = await new Promise(r => { const q = od.transaction("kv").objectStore("kv").get("items"); q.onsuccess = () => r(!!q.result); q.onerror = () => r(false); }); od.close();
        if (had) { await metaPut({ id: "main", name: "My canvas", created: Date.now(), updated: Date.now(), count: 0, thumb: "" }); list = await metaAll(); }
      }
    } catch (e) {}
  }
  list.sort((a, b) => b.updated - a.updated);

  home.innerHTML = "<div class='wrap'><div class='brand'>" + WORDMARK_SVG + "</div><div class='head'><h1>Your canvases</h1><p class='sub'>Pick one to open it, or start a new one</p></div><div id='grid'></div></div>";
  if (ACCOUNT) {                                           // account bar: plan, upgrade / billing, log out
    const bar = document.createElement("div");
    bar.style.cssText = "display:flex;justify-content:flex-end;align-items:center;gap:10px;margin:-28px 0 18px;font-size:13px;color:var(--muted)";
    const pro = ACCOUNT.plan === "pro";
    bar.innerHTML = "<span title='" + ACCOUNT.email + "' style='padding:3px 10px;border-radius:99px;border:1px solid var(--border);color:var(--text)'>" + (pro ? "Pro" : "Free") + "</span>"
      + "<button class='ab-plan'>" + (pro ? "Manage billing" : "Upgrade to Pro") + "</button><button class='ab-out'>Log out</button>";
    bar.querySelectorAll("button").forEach(b => b.style.cssText = "background:none;border:0;color:var(--link);cursor:pointer;font:inherit;padding:2px 4px");
    bar.querySelector(".ab-plan").onclick = async () => {
      if (!pro) return showUpgrade();
      try { location.href = (await postJson("/api/portal")).url; } catch (e) { alert(e.message); }   // Stripe customer portal
    };
    bar.querySelector(".ab-out").onclick = async () => { try { await postJson("/api/logout"); } catch (e) {} location.href = "/"; };
    home.querySelector(".wrap").insertBefore(bar, home.querySelector(".brand"));
  }
  const grid = home.querySelector("#grid");
  const open = id => { location.hash = "#c=" + id; };
  const make = tag => document.createElement(tag);

  // "New canvas" card
  const nw = make("div"); nw.className = "cv new";
  nw.innerHTML = "<div class='shot'><div class='plus'>+</div>New canvas</div>";
  nw.querySelector(".shot").onclick = async () => {
    if (isFree() && list.length >= ACCOUNT.limits.canvases) { showUpgrade("canvases"); return; }   // Free plan limit
    const name = (prompt("Name of the new canvas:", "Untitled canvas") || "").trim(); if (!name) return;
    const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    await metaPut({ id, name, created: Date.now(), updated: Date.now(), count: 0, thumb: "" }); open(id);
  };
  grid.appendChild(nw);

  for (const m of list) {                                  // one card per canvas: picture on top, name below
    const d = make("div"); d.className = "cv";
    const shot = make("div"); shot.className = "shot";
    if (m.thumb) shot.style.backgroundImage = "url(" + m.thumb + ")"; else { shot.textContent = m.count ? "Open to create a preview" : "Empty canvas"; shot.classList.add("blank"); }
    shot.onclick = () => open(m.id);
    const name = make("input"); name.value = m.name; name.maxLength = 60; name.spellcheck = false; name.title = "Click to rename";
    name.onchange = async () => { const cur = (await metaGet(m.id)) || m; cur.name = name.value.trim() || "Untitled canvas"; name.value = cur.name; await metaPut(cur); };
    name.onkeydown = e => { if (e.key === "Enter") name.blur(); };
    const info = make("small"); info.textContent = (m.count ? m.count + " item" + (m.count === 1 ? "" : "s") + " · " : "") + ago(m.updated);
    const del = make("button"); del.className = "del"; del.textContent = "✕"; del.title = "Delete this canvas";
    del.onclick = async () => {
      if (!confirm('Delete "' + m.name + '" and everything in it? This cannot be undone.')) return;
      await metaDel(m.id);
      try { indexedDB.deleteDatabase(dbNameOf(m.id)); } catch (e) {}
      d.remove();
    };
    d.append(shot, name, info, del); grid.appendChild(d);
  }
  // the list refreshes when another tab changes something
  window.addEventListener("focus", () => { if (!document.activeElement || document.activeElement.tagName !== "INPUT") location.reload(); });
}

     <h2>Not supported on mobile yet</h2>
     <p>Canvas PRO needs a mouse and a bigger screen for now. Open this page on a computer to use it.</p>
     <div class="rule"></div>
     <small>Mobile support is coming later.</small>`;
  document.body.appendChild(box);
}

if (BLOCK_MOBILE && isMobile()) showMobileNotice();
else if (CANVAS_ID) boot(); else showHome();
if (ACCOUNT) {                                             // coming from the pricing page / back from Stripe
  const q = new URLSearchParams(location.search);
  if (q.get("upgrade") && isFree()) setTimeout(() => showUpgrade(), 300);
  if (q.get("welcome") === "pro") setTimeout(() => { try { toast("Welcome to Pro. Thank you!", "", 4000); } catch (e) {} }, 400);
  if (q.has("upgrade") || q.has("welcome")) history.replaceState(null, "", location.pathname + location.hash);
}
</script>
