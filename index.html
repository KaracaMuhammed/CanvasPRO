<style>
  /* ---------- COLORS (edit these to restyle everything) ---------- */
  :root {
    --bg: #f6f4ef; --dot: #d9d5c9; --card: #ffffff; --text: #26241f;
    --muted: #8a867b; --accent: #2f64e0; --link: #2f64e0; --border: #e2ded2;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1b1a17; --dot: #34322c; --card: #262420; --text: #ece9e0;
      --muted: #8f8b80; --accent: #7ea2ff; --link: #7ea2ff; --border: #3a372f;
    }
  }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 15px/1.5 "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: -0.005em;
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;   /* smooth font (change "Inter" to try another) */ display: flex; flex-direction: column; }

  /* ---------- TOOLBAR ---------- */
  .bar { display: flex; gap: 8px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  #homeBtn { display: inline-flex; align-items: center; gap: 7px; } #homeBtn svg { flex: none; } #homeBtn:hover { color: var(--accent); }
  @media (max-width: 560px) { #homeBtn span { display: none; } }   /* icon only on small screens */
  #titleBox { flex: 1 1 120px; min-width: 0; display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--text); }
  #canvasName { flex: 0 1 auto; field-sizing: content; min-width: 90px; max-width: 260px; box-sizing: border-box; text-align: center; font: inherit; font-size: 17px; font-weight: 650; color: var(--text);
    background: transparent; border: 1px solid transparent; border-radius: 8px; padding: 2px 8px; }
  #canvasName:hover { border-color: var(--border); } #canvasName:focus { outline: none; border-color: var(--accent); background: var(--card); }
  .bar h1 { font-size: 16px; margin: 0 8px 0 0; }
  .bar button { background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; cursor: pointer; font: inherit; }
  .bar button:hover { border-color: var(--accent); }
  .bar small { color: var(--muted); }
  #saveState { font-size: 12.5px; white-space: nowrap; } #saveState.ok { color: var(--accent); font-weight: 600; display: inline-flex; align-items: center; gap: 5px; } #saveState svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; } #saveState.bad { color: #d9480f; font-weight: 600; }

  /* ---------- CANVAS (scrollable, dotted background) ---------- */
  .scroller { flex: 1; overflow: auto; }
  #board { position: absolute; left: 0; top: 0; width: 3000px; height: 2000px; --grid: 24px; --pad: 1500px; --layer-w: 6000px; --layer-h: 5000px; }   /* left/top/--pad/--layer-* are set by layoutStage() */
  /* The dots are drawn by a layer that is bigger than the board (it also covers the margin), so they never stop near the edges.
     Shifted by half a tile so the dots sit exactly on multiples of the grid size (the snap points). Shown only while snapping is on (class .dots). */
  #board::before { content: ""; display: none; position: absolute; left: calc(-1 * var(--pad)); top: calc(-1 * var(--pad)); width: var(--layer-w); height: var(--layer-h);
    background-image: radial-gradient(var(--dot) 1.2px, transparent 1.2px); background-size: var(--grid) var(--grid);
    background-position: calc(var(--pad) - var(--grid) / 2) calc(var(--pad) - var(--grid) / 2); pointer-events: none; }
  #board.dots::before { display: block; }

  /* ---------- CARDS (notes and images) ---------- */
  .card { position: absolute; box-sizing: border-box; width: 240px; min-width: 140px; background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,.08); resize: horizontal; overflow: hidden; }
  .grip { display: flex; align-items: center; gap: 8px; padding: 6px 8px; cursor: grab; touch-action: none;
    border-bottom: 1px solid var(--border); color: var(--muted); user-select: none; }
  .grip .spacer { flex: 1; }
  .grip button { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 16px; }
  .body { padding: 8px 10px; white-space: pre-wrap; word-break: break-word; min-height: 24px; cursor: text; }
  .body.empty { color: var(--muted); }
  .done .body { text-decoration: line-through; opacity: .55; }
  .body a { color: var(--link); }   /* web addresses are blue */
  textarea, input.link { width: 100%; box-sizing: border-box; background: transparent; color: var(--text);
    border: 0; outline: 0; font: inherit; resize: none; padding: 8px 10px; }
  input.link { border-top: 1px solid var(--border); font-size: 13px; color: var(--link); }
  .card img { display: block; width: 100%; height: auto; }
  .card img.linked { cursor: pointer; }
  /* images embedded inside a note */
  .inline-img { position: relative; padding: 0 10px 8px; }
  .inline-img img { border-radius: 6px; }
  .inline-img .rm { position: absolute; top: 6px; right: 16px; width: 22px; height: 22px; border: 0; border-radius: 50%;
    background: rgba(0,0,0,.55); color: #fff; cursor: pointer; line-height: 1; }
  .inline-img input.link { border: 1px solid var(--border); border-radius: 6px; margin-top: 4px; padding: 4px 8px; }

  /* ---------- PREMIUM DEADLINE (edit colors / sizes here) ---------- */
  .foot { padding: 7px 8px 8px; border-top: 1px solid var(--border); }
  /* the chip: a progress ring + "time left" + date. --c is the state color */
  .dl { --c: var(--muted); display: inline-flex; align-items: center; gap: 7px; max-width: 100%; box-sizing: border-box;
    padding: 4px 11px 4px 6px; border-radius: 999px; border: 1px solid color-mix(in srgb, var(--c) 35%, var(--border));
    background: color-mix(in srgb, var(--c) 10%, transparent); color: var(--text); font: inherit; font-size: 12px; cursor: pointer;
    transition: background .25s, border-color .25s, transform .15s; }
  .dl:hover { transform: translateY(-1px); background: color-mix(in srgb, var(--c) 18%, transparent); }
  .dl .ring { width: 22px; height: 22px; flex: none; transform: rotate(-90deg); }
  .dl .ring circle { fill: none; stroke-width: 3; }
  .dl .ring .track { stroke: var(--border); }
  .dl .ring .bar { stroke: var(--c); stroke-linecap: round; transition: stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1), stroke .25s; }
  .dl .t { font-weight: 650; color: var(--c); white-space: nowrap; }
  .dl .d { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dl.none { border-style: dashed; }                 /* no deadline yet: quiet ghost chip */
  .dl.none .t { font-weight: 500; color: var(--muted); }
  .dl.ok   { --c: #22c55e; }                         /* plenty of time */
  .dl.warn { --c: #f59e0b; }                         /* more than half used */
  .dl.hot  { --c: #f97316; }                         /* almost due */
  .dl.late { --c: #ef4444; }                         /* overdue */
  .dl.done { --c: #22c55e; }                         /* task finished */
  /* overdue cards get a soft pulsing red glow */
  .card.overdue { animation: glow 2.4s ease-in-out infinite; border-color: #ef4444; }
  @keyframes glow { 0%,100% { box-shadow: 0 2px 8px rgba(0,0,0,.08), 0 0 0 0 rgba(239,68,68,.0); }
                    50%     { box-shadow: 0 4px 18px rgba(239,68,68,.28), 0 0 0 3px rgba(239,68,68,.12); } }
  /* the popover that opens under the chip */
  #pop { position: fixed; z-index: 50; width: 264px; box-sizing: border-box; padding: 14px; border-radius: 16px;
    background: var(--card); color: var(--text); border: 1px solid var(--border); font-size: 13px;
    box-shadow: 0 16px 48px rgba(0,0,0,.25); animation: popin .16s ease-out; }
  #pop[hidden] { display: none; }
  @keyframes popin { from { opacity: 0; transform: translateY(-4px) scale(.98); } to { opacity: 1; transform: none; } }
  #pop .ph { font-weight: 650; margin-bottom: 10px; }
  #pop .pgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  #pop button { font: inherit; font-size: 12px; padding: 7px 8px; border-radius: 10px; cursor: pointer;
    background: transparent; color: var(--text); border: 1px solid var(--border); transition: background .15s, border-color .15s; }
  #pop button:hover { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); }
  #pop .pl { margin: 12px 0 5px; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
  #pop input { width: 100%; box-sizing: border-box; padding: 7px 8px; border-radius: 10px; font: inherit; font-size: 13px;
    background: transparent; color: var(--text); border: 1px solid var(--border); color-scheme: light dark; }
  #pop button.rm2 { width: 100%; margin-top: 8px; color: #ef4444; border-color: transparent; }
  /* the calendar */
  #pop .cal { border: 1px solid var(--border); border-radius: 12px; padding: 8px; }
  #pop .calhead { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; font-weight: 600; }
  #pop .calhead button { width: 26px; height: 26px; padding: 0; border: 0; border-radius: 50%; font-size: 16px; line-height: 1; }
  #pop .calgrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; }
  #pop .calgrid.wk span { font-size: 10px; color: var(--muted); padding: 2px 0; }
  #pop .calgrid button { border: 0; border-radius: 50%; padding: 0; height: 30px; font-size: 12px; background: transparent; }
  #pop .calgrid button.today { box-shadow: inset 0 0 0 1px var(--muted); }
  #pop .calgrid button.pick { background: var(--accent); color: #fff; box-shadow: none; font-weight: 650; }
  #pop .trow { display: flex; align-items: center; justify-content: space-between; margin: 10px 0 10px; }
  #pop .tgroup { display: inline-flex; align-items: center; gap: 2px; border: 1px solid var(--border); border-radius: 10px; padding: 2px 6px; }
  #pop input.tbox { width: 34px; border: 0; padding: 5px 0; text-align: center; background: transparent; -moz-appearance: textfield; appearance: textfield; }
  #pop input.tbox::-webkit-inner-spin-button, #pop input.tbox::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  #pop input.tbox:focus { outline: none; color: var(--accent); }
  #pop button.setbtn { width: 100%; padding: 9px; background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; font-size: 13px; }
  #pop button.setbtn:hover { background: var(--accent); filter: brightness(1.1); }
  /* PRIORITIES: colored left edge on the card + a small badge in the header (edit the colors here) */
  .card.prio-1 { border-left: 5px solid #3b82f6; }   /* low    = blue   */
  .card.prio-2 { border-left: 5px solid #f59e0b; }   /* medium = orange */
  .card.prio-3 { border-left: 5px solid #e5484d; }   /* high   = red    */
  .grip button.pbtn { font-size: 11px; font-weight: 600; border-radius: 10px; padding: 1px 8px; border: 1px solid var(--border); color: var(--muted); }
  .grip button.p1 { background: #3b82f6; border-color: #3b82f6; color: #fff; }
  .grip button.p2 { background: #f59e0b; border-color: #f59e0b; color: #fff; }
  .grip button.p3 { background: #e5484d; border-color: #e5484d; color: #fff; }
  /* SPLIT buttons with a small arrow (Draw and Snap to grid): same look as the other toolbar buttons, with a thin divider before the arrow */
  .bar .split.soft { border-radius: 10px; background: var(--card); }
  .bar .split.soft button { padding: 7px 14px; }
  .bar .split.soft button.more { padding: 7px 9px; font-size: 11px; color: var(--muted); }
  .bar .split.soft button + button { border-left: 1px solid var(--border); }
  .bar .split.soft.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--card)); }       /* lit up while the feature is on */
  .bar .split.soft.on button, .bar .split.soft button.on { color: var(--accent); background: transparent; border-color: transparent; }
  .bar .split.soft.on button + button { border-left-color: color-mix(in srgb, var(--accent) 35%, transparent); }
  /* the Save-version "split" look (blue frame, glow) is defined further down for ALL .split: these #id rules put Draw / Snap back to a quiet look */
  .bar #snapGrp, .bar #drawGrp { border-color: var(--border); box-shadow: none; }
  .bar #snapGrp.on, .bar #drawGrp.on { border-color: var(--accent); }
  .bar #snapGrp button, .bar #drawGrp button { color: var(--text); font-weight: 500; }
  .bar #snapGrp button.more, .bar #drawGrp button.more { color: var(--muted); }
  .bar #snapGrp button + button, .bar #drawGrp button + button { border-left: 1px solid var(--border); }
  .bar #snapGrp.on button, .bar #drawGrp.on button { color: var(--accent); }
  .bar #snapGrp.on button + button, .bar #drawGrp.on button + button { border-left-color: color-mix(in srgb, var(--accent) 35%, transparent); }
  /* the small menu that opens under the arrow */
  #optMenu { position: fixed; z-index: 50; width: 250px; box-sizing: border-box; padding: 6px; border-radius: 14px;
    background: var(--card); color: var(--text); border: 1px solid var(--border); box-shadow: 0 16px 48px rgba(0,0,0,.25); animation: popin .16s ease-out; }
  #optMenu[hidden] { display: none; }
  #optMenu .oh { padding: 6px 10px 4px; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
  #optMenu button { display: grid; grid-template-columns: 18px 1fr; align-items: start; column-gap: 6px; width: 100%; box-sizing: border-box; padding: 8px 10px; border: 0; border-radius: 9px;
    background: transparent; color: var(--text); font: inherit; font-size: 13px; text-align: left; cursor: pointer; }
  #optMenu button small { grid-column: 2; color: var(--muted); font-size: 11px; }
  #optMenu button:hover { background: color-mix(in srgb, var(--accent) 10%, transparent); }
  #optMenu button .ck { color: var(--accent); font-weight: 700; }
  /* SNAP toggle button (lit up when on) */
  .bar button.on { border-color: var(--accent); color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--card)); }
  /* FINISHED task: embedded images and video previews fade out (hover to peek at full strength) */

  /* YOUTUBE preview: thumbnail + red play button, click opens the video */
  .yt { position: relative; display: block; margin: 0 10px 8px; border-radius: 8px; overflow: hidden; background: #000; aspect-ratio: 16 / 9; }
  .yt img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .yt .play { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
  .yt .play::before { content: "▶"; width: 46px; height: 32px; line-height: 32px; text-align: center; border-radius: 9px;
    background: #ff0000; color: #fff; font-size: 14px; box-shadow: 0 2px 10px rgba(0,0,0,.4); }
  .yt:hover .play::before { transform: scale(1.1); }
  .yt .fb { position: absolute; inset: 0; display: flex; align-items: flex-end; padding: 8px 10px; color: #ccc; font-size: 12px;
    background: linear-gradient(135deg, #1f1f1f, #444); }   /* shown only if the thumbnail can't load */
  /* TOOLBAR extras: selects, color picker, drawing tools */

  #ink { position: absolute; left: calc(-1 * var(--pad)); top: calc(-1 * var(--pad)); width: var(--layer-w); height: var(--layer-h); overflow: visible; pointer-events: none; }   /* covers the margin around the board as well */

  .bar .seggrp button, .bar .split button { border: 0; border-radius: 0; background: transparent; padding: 6px 12px; }

  /* the dropdown list of saved versions */
  #snapList { position: fixed; z-index: 50; width: 300px; max-height: 60vh; overflow-y: auto; box-sizing: border-box; padding: 8px;

  /* ---------- TOASTS (the 5-second undo after deleting) ---------- */

    background: #23221f; color: #fff; font-size: 13px; box-shadow: 0 8px 28px rgba(0,0,0,.35); animation: popin .16s ease-out; }

  /* ---------- FREE TEXT: no card, just text. The header only shows on hover ---------- */

  /* ---------- Version list: header, "you are here", paging ---------- */
  #snapList .sh { display: flex; justify-content: space-between; align-items: center; }

  #snapList .top { display: flex; align-items: center; }

  /* ---------- Tool menu: icons and labels all aligned ---------- */

  #toolMenu { position: fixed; z-index: 50; min-width: 176px; box-sizing: border-box; padding: 6px; border-radius: 14px;
    background: var(--card); color: var(--text); border: 1px solid var(--border); box-shadow: 0 16px 48px rgba(0,0,0,.25); animation: popin .16s ease-out; }

  #toolMenu button:hover { background: color-mix(in srgb, var(--accent) 10%, transparent); }
  #toolMenu button.sel { color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); font-weight: 600; }
  /* ---------- "Add image" tile inside notes: looks like an empty picture, lights up on hover ---------- */
  .addpic { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; box-sizing: border-box;
    width: calc(100% - 20px); min-height: 78px; margin: 0 10px 8px; padding: 8px; border: 2px dashed var(--border); border-radius: 10px;
    background: color-mix(in srgb, var(--muted) 8%, transparent); color: var(--muted); font: inherit; font-size: 12px; font-weight: 600; cursor: pointer;
    transition: border-color .15s, background .15s, color .15s, box-shadow .15s; }

  .addpic:hover svg, .card.dropping .addpic svg { transform: scale(1.18) rotate(-5deg); }
  .card.dropping { outline: 2px solid var(--accent); outline-offset: -2px; }
  /* ---------- Move handle on pictures inside notes ---------- */
  .imove { position: absolute; top: 6px; left: 16px; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center;
    border-radius: 8px; background: rgba(0,0,0,.6); color: #fff; cursor: grab; touch-action: none; opacity: 0; transition: opacity .15s, transform .15s; }

  .inline-img.ins-before::before, .inline-img.ins-after::after { content: ""; position: absolute; left: 10px; right: 10px; height: 3px; border-radius: 2px; background: var(--accent); z-index: 3; }
  .inline-img.ins-before::before { top: -3px; }
  .inline-img.ins-after::after { bottom: 2px; }
  .ghost { position: fixed; z-index: 100; width: 120px; height: auto; border-radius: 8px; opacity: .9; pointer-events: none; transform: rotate(-3deg);
    box-shadow: 0 10px 30px rgba(0,0,0,.35); }
  /* header icon that toggles the "Add image" field */

  .grip button.addtoggle svg { width: 18px; height: 18px; }

  .grip button.addtoggle.on { color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); }
  /* the Add image field is closed until the header icon is pressed; a line shrinks over its 5 seconds */
  .addpic { position: relative; overflow: hidden; }

  /* the editor must be exactly as big as the text it replaces */
  .card textarea { display: block; overflow: hidden; min-height: 0; }

  #fileMenu { position: fixed; z-index: 50; width: 290px; box-sizing: border-box; padding: 6px; border-radius: 14px;
    background: var(--card); color: var(--text); border: 1px solid var(--border); box-shadow: 0 16px 48px rgba(0,0,0,.25); animation: popin .16s ease-out; }
  #fileMenu[hidden] { display: none; }

  #fileMenu button:hover { background: color-mix(in srgb, var(--accent) 10%, transparent); }

  .prog i { width: 36px; height: 5px; border-radius: 3px; background: linear-gradient(90deg, var(--accent) var(--p), var(--border) var(--p)); }
  .prog.all { color: #22c55e; }

  .grip button.copybtn svg { width: 18px; height: 18px; }
  .grip button.copybtn:hover { color: var(--accent); }
  .grip button.frmbtn.off { opacity: .45; }                /* picture border is off: the icon is dimmed */
  .card.nob { border-color: transparent; box-shadow: none; background: transparent; }   /* picture without border */

  .linkonly { padding: 4px 10px; font-size: 11px; font-weight: 600; color: #b45309; background: color-mix(in srgb, #f59e0b 16%, transparent); }
  /* offer to turn on auto-save to a file */
  #fileOffer { position: fixed; z-index: 60; top: 64px; left: 50%; transform: translateX(-50%); display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
    max-width: calc(100vw - 24px); box-sizing: border-box; padding: 10px 14px; border-radius: 14px; background: var(--card); color: var(--text);
    border: 1px solid var(--accent); box-shadow: 0 12px 36px rgba(0,0,0,.25); font-size: 13px; animation: popin .2s ease-out; }
  #fileOffer button { font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 9px; cursor: pointer; border: 1px solid var(--border); background: transparent; color: var(--text); }
  #fileOffer button.yes { background: var(--accent); border-color: var(--accent); color: var(--card); font-weight: 600; }
  /* header: the right-hand icons stay together and wrap to a second line when the note is narrow (never cut off) */
  .grip { flex-wrap: wrap; row-gap: 2px; }

  /* checkboxes drawn by the page (no special font needed, so they look the same on phones) */

    text-indent: 300%; color: transparent; font-size: 1em; cursor: pointer; user-select: none; transform: none; }
  .cb::before { content: ""; position: absolute; inset: 1px; box-sizing: border-box; border: 2px solid var(--muted); border-radius: 5px; transition: border-color .15s, background .15s; }

  /* ---------- Selection ---------- */

  /* ---------- PDF export: only #printRoot is printed, on one page sized to the content ---------- */

    #printRoot { display: block !important; }

  #marquee { position: absolute; display: none; z-index: 15; pointer-events: none; box-sizing: border-box;
    border: 1.5px dashed var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); border-radius: 3px; }
  /* ---------- Highlighted text ---------- */

  /* ---------- PREMIUM TOOLBAR LOOK (champagne-gold accent, quiet line icons, ink "Save version") ---------- */

  #fileBtn .fok { flex: none; font-weight: 600; color: var(--accent); font-size: 13px; display: inline-flex; } #fileBtn .fok svg { width: 15px; height: 15px; opacity: 1; stroke-width: 2; }

  /* ---------- SELECTIONS ARE BLUE (selected cards and drawings, the drag rectangle, selected text) ---------- */

<script>
/* =====================================================================
   DATA MODEL
   items = list of cards. Each card is a plain object:
   { id, type: "note" | "image", x, y, w, text, done, src, link,
     deadline (ms timestamp, optional), dlStart (ms when the deadline was set) }
   - note  : a todo line (text + done checkbox)
   - image : src is a data: URL, link is the URL opened on click
   ===================================================================== */
/* =====================================================================
   SEVERAL CANVASES
   Every canvas has its OWN database (so they can never mix). The address says which one is open:
     page.html          -> the home screen with all canvases
     page.html#c=ID     -> the canvas with that ID
   The old single canvas keeps the id "main" and its old database name, so nothing is lost.
   The names + preview pictures live in one small extra database ("canvas-todo-home").
   ===================================================================== */
const hashMatch = location.hash.match(/^#c=([\w-]+)$/);
const CANVAS_ID = hashMatch ? hashMatch[1] : null;                      // null = home screen
const dbNameOf = id => id === "main" ? "canvas-todo" : "canvas-todo-" + id;
const DB_NAME = dbNameOf(CANVAS_ID || "main");
const KEY = "canvas-todo-v1";

/* Header icons: thin line icons (SVG) in one style. Colors follow the text color. */
const HI = {
  layers: '<svg viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/></svg>',
  snap:  '<svg viewBox="0 0 24 24"><path d="M6 3v8a6 6 0 0 0 12 0V3"/><path d="M6 7h4M14 7h4"/></svg>',
  draw:  '<svg viewBox="0 0 24 24"><path d="M4 20l1-4L16.5 4.5a2.1 2.1 0 0 1 3 3L8 19z"/><path d="M14.5 6.5l3 3"/></svg>',
  folder:'<svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2.5h8a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>',
  file:  '<svg viewBox="0 0 24 24"><path d="M12 4v11"/><path d="m7.5 10.5 4.5 4.5 4.5-4.5"/><path d="M5 19h14"/></svg>',
  mark:  '<svg viewBox="0 0 24 24"><path d="M7 4h10a1 1 0 0 1 1 1v15l-6-4-6 4V5a1 1 0 0 1 1-1z"/></svg>',
  link:  '<svg viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>',
  check: '<svg viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>'
};
const withIcon = (name, label) => HI[name] + "<span>" + label + "</span>";

let items = [];
// activeNote  = the note whose text you are currently typing in (pasted images go inside it)
// pendingNote = the note whose 🖼 button was pressed (the chosen file goes inside it)
let activeNote = null, pendingNote = null;
// liveChips = one small "repaint" function per deadline chip; refreshed every 30 s so the countdown stays live
let liveChips = [];
// Priority levels stored on each note as a number 0-3 (item.priority). Labels shown on the badge:
const PRIORITY_LABELS = ["Priority", "Low", "Medium", "High"];

// SNAP TO GRID: when on, cards jump to the dots of the background (the dots are 24px apart)
let GRID = 24;                                 // grid spacing in px, changeable from the toolbar (saved)
try { GRID = +localStorage.getItem("canvas-todo-grid") || 24; } catch (e) {}
let snapOn = false;
try { snapOn = localStorage.getItem("canvas-todo-snap") === "1"; } catch (e) {}
if (window.CANVAS_ACCOUNT && (window.CANVAS_ACCOUNT.locked || []).includes("snap")) snapOn = false;   // Free plan: snap to grid is Pro
const snapW = w => Math.max(144, Math.round(w / GRID) * GRID);   // widths snap too (never narrower than 144px)
const snap = v => snapOn ? Math.round(v / GRID) * GRID : v;   // nearest grid point (or unchanged when off)

// --- Load / save in the browser (wrapped in try/catch: storage can fail) ---
/* =====================================================================
   STORAGE (IndexedDB) - replaces the old 5 MB localStorage
   Database "canvas-todo" with two stores:
     "kv"     : key -> value        ("items" = all the cards, "strokes" = the drawing)
     "images" : image id -> Blob    (pictures are kept as real image files, not as text)
   Cards point to their pictures by id (item.img, or image.img for pictures inside a note).
   ===================================================================== */
let db = null;                          // the open database (null = storage unavailable)
const urlCache = {};                    // image id -> temporary URL used as <img src>
const keep = new Set();                 // ids of pictures just added (protected from the clean-up below)
const imgUrl = o => (o.img && urlCache[o.img]) || o.url || o.src || "";   // src = old format, still displayed
// The small status text next to the buttons. Saving is automatic, so the text says so clearly.
const setStatus = t => {
  const el = document.getElementById("saveState"); if (!el) return;
  const ok = /^(Auto-saved|Updated)/.test(t);                          // saved / refreshed from another tab
  const bad = /^\u26a0/.test(t);                                       // a warning
  el.textContent = t;                                                  // plain quiet text, e.g. "Auto-saved ✓"
  el.className = ok ? "ok" : bad ? "bad" : "";
  el.title = "Your canvas saves itself after every change. You do not need to press anything.";
};

function openDb(name = DB_NAME) {
  return new Promise((res, rej) => {
    const rq = indexedDB.open(name, 1);
    rq.onupgradeneeded = () => { rq.result.createObjectStore("kv"); rq.result.createObjectStore("images"); };
    rq.onsuccess = () => res(rq.result); rq.onerror = () => rej(rq.error);
  });
}
// Tiny helpers: run one request in its own transaction and wait for the result
const dbReq = (store, mode, make) => new Promise((res, rej) => {
  const t = db.transaction(store, mode), r = make(t.objectStore(store));
  t.oncomplete = () => res(r.result); t.onerror = t.onabort = () => rej(t.error);
});
const dbGet  = (s, k)    => dbReq(s, "readonly",  st => st.get(k));
const dbPut  = (s, k, v) => dbReq(s, "readwrite", st => st.put(v, k));
const dbDel  = (s, k)    => dbReq(s, "readwrite", st => st.delete(k));
const dbKeys = s         => dbReq(s, "readonly",  st => st.getAllKeys());

// Store one picture (a Blob) and return its id
async function putImage(blob) {
  const id = uid();
  urlCache[id] = URL.createObjectURL(blob); keep.add(id);
  try { await dbPut("images", id, blob); } catch (e) { setStatus("⚠ Not saved"); }
  return id;
}

// save() is called everywhere after a change. It waits 0.3 s (so dragging doesn't write non-stop), then flush() writes.
let saveTimer = null;
/* ---------- Undo / redo (Ctrl+Z, Ctrl+Shift+Z or Ctrl+Y) ----------
   Every change to the cards or the drawing is a step. Changes that follow each other within a third of a second count as ONE step.
   While you type in a note the browser's own undo works inside the text; this one works on the canvas (move, delete, resize, draw, border...). */
const hist = { undo: [], redo: [], cur: null, timer: null };
const histState = () => JSON.stringify({ items, strokes });
function histInit() { hist.cur = histState(); hist.undo = []; hist.redo = []; }
function histCommit() {                                  // close the current step: remember how the canvas looked BEFORE it
  clearTimeout(hist.timer); if (hist.cur === null) return;
  const now = histState(); if (now === hist.cur) return;
  hist.undo.push(hist.cur); if (hist.undo.length > 60) hist.undo.shift();
  hist.redo = []; hist.cur = now;
}
function histApply(str) { const o = JSON.parse(str); items = o.items; strokes = o.strokes; hist.cur = str; clearSel(); drawAll(); render(); save(); }
let undoToast = null;                                   // the "Undo" popup that is on screen right now (set by toast())
function undo() {
  if (undoToast) { undoToast.fire(); return; }          // an "Undo" popup is showing: Ctrl+Z does what its button does, and the popup closes
  histCommit(); const prev = hist.undo.pop(); if (!prev) return toast("Nothing to undo", "OK", 1500); hist.redo.push(hist.cur); histApply(prev);
}
function redo() { histCommit(); const next = hist.redo.pop(); if (!next) return toast("Nothing to redo", "OK", 1500); hist.undo.push(hist.cur); histApply(next); }
function save() { setStatus("Saving…"); clearTimeout(saveTimer); saveTimer = setTimeout(flush, 300); clearTimeout(hist.timer); hist.timer = setTimeout(histCommit, 350); layoutStage(); }

/* =====================================================================
   SEVERAL TABS AT ONCE
   Before, every tab wrote ITS OWN copy of everything, so a tab that had been open for a while
   overwrote what you did in a newer tab. Now:
   - every write has a revision number (myRev, a time stamp);
   - before writing, a tab first MERGES what other tabs saved (mergeList): their changes are kept,
     only what you changed in this tab is applied on top, and what you deleted stays deleted;
   - tabs tell each other about every save (BroadcastChannel) and update live;
   - a tab refreshes itself when you come back to it.
   ===================================================================== */
let myRev = 0;                                           // revision of the data this tab is based on
let base = { items: new Map(), strokes: new Map(), snaps: new Map() };   // what the database had at our last read/write: id -> signature
const sigJson = x => JSON.stringify(x);
const sigSnap = x => x.id + "|" + x.auto + "|" + x.n;    // saved versions never change, except the auto flag and the number
const mkBase = (list, sig) => new Map(list.map(x => [x.id, sig(x)]));
function setBase(i, st, n) { base = { items: mkBase(i, sigJson), strokes: mkBase(st, sigJson), snaps: mkBase(n, sigSnap) }; }
// dbList = what the database has now, local = what this tab has, baseMap = what the database had when we last looked.
// Result: the database list, plus the changes made in THIS tab (new or edited elements), minus what this tab deleted.
function mergeList(dbList, local, baseMap, sig) {
  const localIds = new Set(local.map(x => x.id));
  const out = dbList.filter(d => !(baseMap.has(d.id) && !localIds.has(d.id)));   // deleted in this tab: drop it
  const at = new Map(out.map((d, i) => [d.id, i]));
  local.forEach(x => {
    if (baseMap.get(x.id) === sig(x)) return;            // not touched in this tab: the database version wins
    if (at.has(x.id)) out[at.get(x.id)] = x; else { at.set(x.id, out.length); out.push(x); }   // edited or new here
  });
  return out;
}
// Take in what another tab saved (returns true if something new was merged in)
async function pullFromDb() {
  const rev = (await dbGet("kv", "rev")) || 0;
  if (rev <= myRev) return false;
  const dbI = (await dbGet("kv", "items")) || [], dbS = (await dbGet("kv", "strokes")) || [], dbN = (await dbGet("kv", "snapshots")) || [];
  items = mergeList(dbI, items, base.items, sigJson);
  strokes = mergeList(dbS, strokes, base.strokes, sigJson);
  snaps = mergeList(dbN, snaps, base.snaps, sigSnap).sort((a, b) => b.date - a.date);
  if (curId && !snaps.some(x => x.id === curId)) curId = null;
  setBase(dbI, dbS, dbN); myRev = rev;
  for (const k of await dbKeys("images")) if (!urlCache[k]) urlCache[k] = URL.createObjectURL(await dbGet("images", k));   // pictures added in other tabs
  return true;
}
// Other tabs: live update (skipped while you type or draw here: your next save merges anyway)
async function syncNow() {
  if (!db || activeNote || current || erasingNow) return;
  try { if (await pullFromDb()) { drawAll(); render(); updateSplit(); setStatus("Updated from another tab ✓"); } } catch (e) {}
}
const chan = "BroadcastChannel" in window ? new BroadcastChannel("canvas-todo-" + (CANVAS_ID || "home")) : null;
if (chan) chan.onmessage = () => syncNow();
document.addEventListener("visibilitychange", () => { if (!document.hidden) syncNow(); });
window.addEventListener("focus", syncNow);

// flush() writes everything. Calls are queued one after the other so two writes never overlap.
let flushChain = Promise.resolve();
const flush = () => (flushChain = flushChain.then(doFlush, doFlush));
async function doFlush() {
  if (!db) return setStatus("⚠ Not saved (storage unavailable)");
  try {
    const pulled = await pullFromDb();                   // 1) first take in what other tabs saved
    myRev = Math.max(Date.now(), myRev + 1);             // 2) then write, with a newer revision
    await dbPut("kv", "items", items);
    await dbPut("kv", "strokes", strokes);
    await dbPut("kv", "snapshots", snaps);
    await dbPut("kv", "currentVersion", curId);
    await dbPut("kv", "rev", myRev);
    setBase(items, strokes, snaps);
    if (chan) chan.postMessage({ rev: myRev });          // 3) tell the other tabs
    // Clean-up: delete stored pictures that no card uses anymore
    const used = new Set();
    const mark = i => { if (i.img) used.add(i.img); (i.images || []).forEach(m => m.img && used.add(m.img)); };
    items.forEach(mark);
    snaps.forEach(sn => sn.items.forEach(mark));      // pictures used by saved versions must be kept too
    keep.forEach(k => used.has(k) && keep.delete(k));
    for (const k of await dbKeys("images")) {
      if (used.has(k) || keep.has(k) || !urlCache[k]) continue;   // !urlCache: added by another tab that this tab has not seen yet, so leave it
      await dbDel("images", k); URL.revokeObjectURL(urlCache[k]); delete urlCache[k];
    }
    setStatus("Auto-saved ✓"); updateSplit();
    queueFileWrite();                                    // also keep the file on your computer up to date (if you linked one)
    queueMeta();                                         // refresh the preview picture on the home screen
    if (pulled && !activeNote && !current && !erasingNow) { drawAll(); render(); }   // something from another tab arrived
  } catch (e) { setStatus("⚠ Not saved"); }
}

// Turns a "data:image/...;base64,..." text into a Blob (used for old data and for backup files)
function dataUrlToBlob(u) {
  const [head, b64] = u.split(","), mime = head.match(/:(.*?);/)[1], bin = atob(b64), a = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
  return new Blob([a], { type: mime });
}

// Gives every card picture its own stored Blob (items coming from the old text format or from a backup file)
async function moveImagesToStore(list) {
  for (const it of list) {
    if (it.src) { it.img = await putImage(dataUrlToBlob(it.src)); delete it.src; }
    for (const im of it.images || []) if (im.src) { im.img = await putImage(dataUrlToBlob(im.src)); delete im.src; }
  }
}
// First start with the new storage: copy what the old localStorage version had saved
async function migrateOld() {
  let old = [];
  try { old = JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) {}
  await moveImagesToStore(old);
  items = old;                          // (the old drawing was already read into `strokes`)
  save();
}

// Starts the app: open the database, load everything, draw the canvas
// Empty space around the board, in BOARD units (so it is the same at every zoom level). Things can be placed from -(PAD - MARGIN) upwards.
const PAD = 1500, MINPOS = -(PAD - 300);
// Top-left corner of what you currently see, in board coordinates. Used to place new cards in view.
const viewX = () => Math.max(MINPOS, scroller.scrollLeft / zoom - PAD);
const viewY = () => Math.max(MINPOS, scroller.scrollTop / zoom - PAD);
// Sets the size of the scrollable area: the board (3000 x 2000) grows when you put things further right or lower, and there is always PAD of free space
// after the farthest item, so nothing ends up glued to the edge. The dotted grid and the drawing layer cover all of it.
function layoutStage() {
  let w = 3000, h = 2000;
  board.querySelectorAll(".card").forEach(c => { w = Math.max(w, c.offsetLeft + c.offsetWidth + 300); h = Math.max(h, c.offsetTop + c.offsetHeight + 300); });
  strokes.forEach(st => (st.pts || []).forEach(([px, py]) => { w = Math.max(w, px + 300); h = Math.max(h, py + 300); }));
  const LW = 2 * PAD + w, LH = 2 * PAD + h;               // size of the whole layer in board units
  stage.style.width = LW * zoom + "px"; stage.style.height = LH * zoom + "px";
  board.style.left = PAD * zoom + "px"; board.style.top = PAD * zoom + "px";
  board.style.setProperty("--pad", PAD + "px"); board.style.setProperty("--layer-w", LW + "px"); board.style.setProperty("--layer-h", LH + "px");
  ink.setAttribute("viewBox", (-PAD) + " " + (-PAD) + " " + LW + " " + LH);   // the layer starts PAD before the board, but drawings keep board coordinates
}
async function boot() {
  try { db = await openDb(); try { navigator.storage.persist(); } catch (e) {} }   // persist() asks the browser not to evict our data
  catch (e) { db = null; setStatus("⚠ Storage unavailable"); }
  if (db) {
    try {
      const saved = await dbGet("kv", "items");
      if (saved) { items = saved; strokes = (await dbGet("kv", "strokes")) || []; }
      else if (CANVAS_ID === "main") await migrateOld();   // old localStorage data belongs to the first canvas only: new canvases start empty
      migrateChecks(items);                                    // old checklist characters -> plain "[ ]" / "[x]"
      snaps = (await dbGet("kv", "snapshots")) || [];   // saved versions for the Save / list button
      curId = (await dbGet("kv", "currentVersion")) || null;   // the version the canvas is based on
      let m = Math.max(0, ...snaps.map(sn => sn.n || 0));      // old saves without a number get one (oldest = 1)
      [...snaps].reverse().forEach(sn => { if (!sn.n) sn.n = ++m; });
      updateSplit();
      myRev = (await dbGet("kv", "rev")) || 0; setBase(items, strokes, snaps);   // the revision this tab starts from
      for (const k of await dbKeys("images")) urlCache[k] = URL.createObjectURL(await dbGet("images", k));
      setStatus("Auto-saved ✓");
    } catch (e) { setStatus("⚠ Could not read saved data"); }
  } else {                              // no database: fall back to the old localStorage so nothing looks lost
    try { items = JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { items = []; }
  }
  histInit();                           // the undo history starts from what was just loaded
  drawAll(); render();
  centerView();                         // open the canvas looking at its content
  await initMeta();                     // name + preview of this canvas for the home screen
  setTimeout(() => queueMeta(true), 1500);   // first preview picture once everything is drawn
  await initFile();                     // reconnect to the file on your computer (if you linked one)
  offerFile();                          // no file yet: offer to choose one (one click)
}

// ----- Smart start position -----
// When a canvas opens we look at the bounding box of EVERYTHING on it (cards + drawings), from the farthest element on the left
// to the farthest on the right, and from the top to the bottom. We zoom out just enough to fit that box on the screen
// (never zoom IN past 100%) and put the middle of the box in the middle of the screen. An empty canvas stays at the top-left.
function centerView() {
  let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
  board.querySelectorAll(".card").forEach(c => {            // every card: position and size on the board (board units, not scaled)
    x1 = Math.min(x1, c.offsetLeft); y1 = Math.min(y1, c.offsetTop);
    x2 = Math.max(x2, c.offsetLeft + c.offsetWidth); y2 = Math.max(y2, c.offsetTop + c.offsetHeight);
  });
  strokes.forEach(st => (st.pts || []).forEach(([px, py]) => {   // every drawn point
    x1 = Math.min(x1, px); y1 = Math.min(y1, py); x2 = Math.max(x2, px); y2 = Math.max(y2, py);
  }));
  if (x1 === Infinity) { setZoom(1); scroller.scrollLeft = PAD * zoom; scroller.scrollTop = PAD * zoom; return; }   // empty canvas: start at the board's top-left corner
  const view = scroller.getBoundingClientRect(), margin = 48;      // margin = free space kept around the content (screen px)
  const w = Math.max(1, x2 - x1), h = Math.max(1, y2 - y1);
  const fit = Math.min((view.width - 2 * margin) / w, (view.height - 2 * margin) / h);   // the zoom at which everything just fits
  setZoom(Math.min(1, fit));                                       // zoom out to fit; setZoom keeps it between 25% and 250%
  // centre of the content on screen; if it still does not fit (more than the 25% minimum zoom can show) show its top-left corner instead
  const cw = w * zoom, ch = h * zoom;
  scroller.scrollLeft = PAD * zoom + (cw + 2 * margin <= view.width  ? (x1 + x2) / 2 * zoom - view.width / 2  : x1 * zoom - margin);
  scroller.scrollTop  = PAD * zoom + (ch + 2 * margin <= view.height ? (y1 + y2) / 2 * zoom - view.height / 2 : y1 * zoom - margin);
}

// (save() now lives in the STORAGE section above)

const board = document.getElementById("board");
const scroller = document.getElementById("scroller");
const uid = () => Math.random().toString(36).slice(2, 9);

/* ---------- Helpers ---------- */
// Escape text so it is safe to inject as HTML
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
// Turn any http(s) URL inside text into a clickable link
const linkify = s => esc(s).replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
// Add https:// if the user typed "example.com"
const fixUrl = u => { u = u.trim(); return !u || /^https?:\/\//i.test(u) ? u : "https://" + u; };

/* ---------- Add cards ---------- */
function addNote(x, y) {
  if (itemLimitReached()) return;                // Free plan limit
  // Default position: top-left of what you currently see
  x = x ?? viewX() + (40 + Math.random() * 80) / zoom;
  y = y ?? viewY() + (40 + Math.random() * 80) / zoom;
  x = snap(x); y = snap(y);                      // new notes also land on a grid point when snapping is on
  // images: pictures embedded INSIDE the note, each { src, link }
  const item = { id: uid(), type: "note", x, y, w: 240, text: "", done: false, images: [], priority: 0 };
  items.push(item); save(); render(item.id);   // render + open editor
}
async function addImage(blob, x, y, url) {
  if (itemLimitReached()) return;                // Free plan limit
  // blob = the picture (stored in its own store). url = only used when a link could not be downloaded.
  const img = blob ? await putImage(blob) : undefined;
  if (x === undefined) { x = viewX() + 60 / zoom; y = viewY() + 60 / zoom; }
  items.push({ id: uid(), type: "image", x: snap(x), y: snap(y), w: 240, img, url, link: "", text: "" });
  save(); render();
}
// Read an image file, shrink it (max 700px) so storage stays small, return it as a Blob (a real image file)
function fileToBlob(file) {
  return new Promise(res => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, 700 / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = img.width * k; c.height = img.height * k;
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); c.toBlob(res, "image/jpeg", 0.8);
    };
    img.src = url;
  });
}

/* ---------- Rendering ---------- */
// Redraws every card. If editId is given, that card's text opens in edit mode.
let rendering = false;
function render(editId) {
  if (rendering) return;                                // removing a card that is being edited fires its "blur", which would redraw again
  rendering = true;
  try {
    board.querySelectorAll(".card").forEach(c => c.remove());   // remove only the cards (the drawing layer stays)
    activeNote = null;                                  // the editor is gone, so nothing is being edited any more
    liveChips = [];
    items.forEach(item => board.appendChild(makeCard(item, item.id === editId)));
  } finally { rendering = false; }
  layoutStage();
}

/* ---------- Checklists inside a note ----------
   A line that starts with "[ ] " (empty box) or "[x] " (ticked box) is a checklist item.
   Type "[] " at the start of a line to make one. The text is plain ASCII, so it works on every phone and keyboard;
   the page draws the real boxes itself (CSS), so no special font is needed.
   (Older notes that used the characters ☐ / ☑ are still understood and are converted when the page opens.) */
function parseCheck(ln) {
  const m = ln.match(/^( *)(\[[ xX]\]|[☐☑]) (.*)$/);             // spaces at the start (indentation) are allowed
  if (!m) return null;
  return { indent: m[1], mark: m[2], on: m[2] === "☑" || /^\[[xX]\]$/.test(m[2]), rest: m[3] };
}
function countChecks(text) {
  let total = 0, done = 0;
  (text || "").split("\n").forEach(l => { const c = parseCheck(l); if (c && /\S/.test(c.rest)) { total++; if (c.on) done++; } });
  return { total, done };
}
// The text of a note as HTML: links, and clickable boxes. The characters stay exactly the same, only wrapped.
function renderBody(text) {
  return text.split("\n").map((ln, i) => {
    const c = parseCheck(ln);
    if (!c) return fmt(ln);
    return c.indent + '<span class="cb' + (c.on ? " on" : "") + '" data-line="' + i + '" title="Click to tick / untick">' + c.mark + '</span> <span class="cbtxt' + (c.on ? " done" : "") + '">' + fmt(c.rest) + '</span>';
  }).join("\n");
}
function toggleCheck(item, n) {                          // tick or untick line n
  const lines = item.text.split("\n"), c = parseCheck(lines[n] || "");
  if (!c) return;
  lines[n] = c.indent + (c.on ? "[ ] " : "[x] ") + c.rest;
  item.text = lines.join("\n"); save(); render();
}
function migrateChecks(list) {                           // old ☐ / ☑ lines -> "[ ]" / "[x]"
  list.forEach(i => { if (i.text && /[☐☑]/.test(i.text)) i.text = i.text.split("\n").map(l => l.replace(/^☐ /, "[ ] ").replace(/^☑ /, "[x] ")).join("\n"); });
}

/* ---------- Copy and paste notes ----------
   The copy icon in a note's header remembers the whole note (text, priority, deadline, pictures).
   Then Ctrl+V on the canvas (or the "Paste note" button at the top, handy on a phone) puts a copy where the pointer is. */
const NOTECLIP_KEY = "canvas-todo-noteclip";
const pasteNoteBtn = document.getElementById("pasteNoteBtn");
function readNoteClip() { try { return JSON.parse(localStorage.getItem(NOTECLIP_KEY)); } catch (e) { return null; } }
function updatePasteBtn() { if (pasteNoteBtn) pasteNoteBtn.hidden = !readNoteClip(); }   // (the button is commented out in the page for now)
// Same text on both sides, whatever the system did to it (Windows turns "\n" into "\r\n", some apps trim or change spaces)
const normClip = t => (t || "").replace(/\r\n?/g, "\n").replace(/\s+/g, " ").trim();
// Write text to the system clipboard. The classic way is tried first (works everywhere after a click, even on a local file).
async function writeClip(text) {
  try {
    const ta = document.createElement("textarea"); ta.value = text; ta.setAttribute("readonly", "");
    ta.style.cssText = "position:fixed;top:0;left:0;opacity:0;pointer-events:none";
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand("copy"); ta.remove();
    if (ok) return true;
  } catch (e) {}
  try { await navigator.clipboard.writeText(text); return true; } catch (e) { return false; }
}
function copyNote(item) {
  const label = (item.text || "").trim() || "(note)";
  try { localStorage.setItem(NOTECLIP_KEY, JSON.stringify({ label, data: item })); } catch (e) {}
  writeClip(label);                                              // puts the note text in the system clipboard: this is how Ctrl+V recognises the note
  updatePasteBtn();
  toast("Note copied. Press Ctrl+V on the canvas to paste it.", "OK", 3500, () => {});
  // Pictures live in THIS canvas's database, so we also put them inside the clip: pasting into ANOTHER canvas works too
  (async () => {
    const blobs = {};
    for (const id of [item.img, ...(item.images || []).map(m => m.img)].filter(Boolean)) {
      try { const b = await dbGet("images", id); if (b) blobs[id] = await blobToDataUrl(b); } catch (e) {}
    }
    if (Object.keys(blobs).length) { try { localStorage.setItem(NOTECLIP_KEY, JSON.stringify({ label, data: item, blobs })); } catch (e) {} }   // too big for localStorage: same-canvas paste still works
  })();
}
async function pasteNote(x, y) {
  if (itemLimitReached()) return;                              // Free plan limit
  const clip = readNoteClip(); if (!clip) return;
  for (const id of Object.keys(clip.blobs || {})) {              // pictures that come from another canvas: store them here first
    if (urlCache[id]) continue;
    try { const b = dataUrlToBlob(clip.blobs[id]); urlCache[id] = URL.createObjectURL(b); keep.add(id); await dbPut("images", id, b); } catch (e) {}
  }
  const n = JSON.parse(JSON.stringify(clip.data));       // a real copy: new id, same pictures (they are shared, not duplicated)
  n.id = uid(); n.x = snap(Math.max(MINPOS, x)); n.y = snap(Math.max(MINPOS, y));
  items.push(n); save(); render();
}
if (pasteNoteBtn) pasteNoteBtn.onclick = () => pasteNote(viewX() + 60 / zoom + Math.random() * 60, viewY() + 60 / zoom + Math.random() * 60);
updatePasteBtn();

function makeCard(item, editing) {
  const el = document.createElement("div");
  el.className = "card" + (item.done ? " done" : "") + (item.priority ? " prio-" + item.priority : "") + (item.type === "text" ? " free" : "") + (item.noBorder ? " nob" : "") + (sel.items.has(item.id) ? " sel" : "");
  el.style.left = item.x + "px"; el.style.top = item.y + "px"; el.style.width = item.w + "px";
  if (item.type === "text") el.style.setProperty("--fs", (item.size || 22) + "px");
  el.dataset.id = item.id;                              // lets drag & drop find which card is under the pointer
  if (item.type === "note") {                           // drop a picture file onto a note = it goes inside that note
    el.ondragover = e => { if ([...(e.dataTransfer.types || [])].includes("Files")) { e.preventDefault(); el.classList.add("dropping"); } };
    el.ondragleave = e => { if (!el.contains(e.relatedTarget)) el.classList.remove("dropping"); };
    el.ondrop = async e => {
      el.classList.remove("dropping");
      const files = [...(e.dataTransfer.files || [])].filter(f => f.type.startsWith("image/"));
      if (!files.length) return;                        // not a file (e.g. an image link): the canvas handles it
      e.preventDefault(); e.stopPropagation();
      for (const f of files) await addImageToNote(item, await fileToBlob(f));
    };
  }   // font size of free text

  // Header: drag handle (+ checkbox for notes) + delete button
  const grip = document.createElement("div");
  grip.className = "grip";
  if (item.type === "note") {
    const cb = document.createElement("input");
    cb.type = "checkbox"; cb.checked = item.done;
    cb.onchange = () => { item.done = cb.checked; save(); render(); };
    grip.appendChild(cb);
    // Priority badge: each click cycles none -> Low -> Medium -> High -> none
    const pr = document.createElement("button");
    const level = item.priority || 0;                 // older notes have no priority yet = 0
    pr.className = "pbtn p" + level;
    pr.textContent = PRIORITY_LABELS[level];
    pr.title = "Click to change the priority";
    pr.onclick = () => { item.priority = (level + 1) % 4; save(); render(); };
    grip.appendChild(pr);
    // Progress of the checklist: "2/5" with a small bar
    const ck = countChecks(item.text);
    if (ck.total) {
      const pg = document.createElement("span");
      pg.className = "prog" + (ck.done === ck.total ? " all" : "");
      pg.title = ck.done + " of " + ck.total + " done";
      pg.innerHTML = '<i style="--p:' + Math.round(100 * ck.done / ck.total) + '%"></i><b>' + ck.done + "/" + ck.total + "</b>";
      grip.appendChild(pg);
    }
  }
  grip.insertAdjacentHTML("beforeend", '<span class="spacer"></span>');
  const acts = document.createElement("span"); acts.className = "acts";   // the icons on the right (copy, image, delete) stay together
  // Free text: A- / A+ buttons change the font size
  if (item.type === "text") {
    [["A−", -4], ["A+", 4]].forEach(([label, d]) => {
      const b = document.createElement("button"); b.className = "tsz"; b.textContent = label; b.title = "Text size";
      b.onclick = () => { item.size = Math.max(10, Math.min(120, (item.size || 22) + d)); save(); render(); };
      acts.appendChild(b);
    });
  }
  // Pictures: a small frame icon turns the border (and shadow) of the picture card on or off
  if (item.type === "image") {
    const bd = document.createElement("button"); bd.className = "copybtn frmbtn" + (item.noBorder ? " off" : ""); bd.innerHTML = ICON_FRAME;
    bd.title = item.noBorder ? "Show the border" : "Hide the border";
    bd.onclick = () => { item.noBorder = !item.noBorder; save(); render(); };
    acts.appendChild(bd);
  }
  const del = document.createElement("button");
  del.textContent = "×"; del.title = "Delete";
  del.onclick = () => removeItem(item);   // deleting can be undone for 5 seconds
  // Notes: a grey image icon in the header opens the "Add image" field for 5 seconds (see setAddField)
  if (item.type === "note") {
    const tg = document.createElement("button");
    tg.className = "addtoggle" + ((addUntil[item.id] || 0) > Date.now() ? " on" : "");   // grey by default, blue only while the field is open
    tg.innerHTML = ICON_IMAGE;
    tg.title = "Add an image (the field opens for 5 seconds)";
    tg.onclick = () => setAddField(item, !((addUntil[item.id] || 0) > Date.now()));   // opens for 5 s (or closes it right away if it is open)
    // copy icon (next to the image icon): copies the whole note, see "Copy and paste notes"
    const cp = document.createElement("button"); cp.className = "copybtn"; cp.innerHTML = ICON_COPY; cp.title = "Copy this note (then Ctrl+V on the canvas)";
    cp.onclick = () => copyNote(item);
    acts.appendChild(cp);
    acts.appendChild(tg);
  }
  acts.appendChild(del);
  grip.appendChild(acts);
  el.appendChild(grip);
  enableDrag(el, grip, item);
  // Pressing a header button must not take the focus away from the note you are typing in
  // (losing focus redraws the card and the click would be lost)
  grip.addEventListener("mousedown", e => { if (e.target.closest("button, input")) e.preventDefault(); });

  // Images: picture (click = open link) + link field
  if (item.type === "image") {
    const img = document.createElement("img");
    img.src = imgUrl(item);
    if (item.link) { img.classList.add("linked"); img.title = item.link; }
    img.onclick = () => item.link && window.open(item.link, "_blank", "noopener");
    el.appendChild(img);
    if (!item.img && item.url) {                         // a picture that could not be downloaded: say it clearly
      const lo = document.createElement("div"); lo.className = "linkonly"; lo.textContent = "Link only · not saved"; el.appendChild(lo);
    }
  }

  // Text area: shows linkified text; click to edit
  const body = document.createElement("div");
  body.className = "body" + (item.text ? "" : " empty");
  body.innerHTML = item.text ? renderBody(item.text) : ({ note: "Click to write…", text: "Type here…" }[item.type] || "Add a caption…");
  const edit = (cx, cy, selA, selB) => {
    // 1) remember the current height: the editor starts with exactly the same size, so nothing jumps
    const h = body.offsetHeight;
    // 2) find where in the text you clicked, so the cursor starts there (end of the text if unknown)
    let caret = item.text.length;
    if (cx !== undefined && item.text) {
      let node, off;
      if (document.caretPositionFromPoint) { const p = document.caretPositionFromPoint(cx, cy); if (p) { node = p.offsetNode; off = p.offset; } }
      else if (document.caretRangeFromPoint) { const r = document.caretRangeFromPoint(cx, cy); if (r) { node = r.startContainer; off = r.startOffset; } }
      if (node && body.contains(node)) {
        const r = document.createRange(); r.setStart(body, 0); r.setEnd(node, off);
        caret = Math.min(item.text.length, r.toString().length);   // characters before the click = position in the text
      }
    } else if (!item.text) caret = 0;
    caret = hlToClean(item.text, caret);                          // the editor shows the text without the highlight marks
    const ta = document.createElement("textarea");
    // HIGHLIGHTS: the editor only shows clean text. The colours are kept as ranges and painted behind the text (see the highlight section).
    const model = hlParse(item.text), back = document.createElement("div"); back.className = "hlback";
    let prevClean = model.clean;
    const sync = () => {                                           // call after the text changed: moves the ranges, saves, repaints
      hlShift(model.ranges, prevClean, ta.value); prevClean = ta.value;
      item.text = hlSerialize(prevClean, model.ranges); hlPaint(back, prevClean, model.ranges);
    };
    ta._hl = { model, back, refresh: () => { prevClean = ta.value; item.text = hlSerialize(prevClean, model.ranges); hlPaint(back, prevClean, model.ranges); } };
    ta.value = model.clean; ta.rows = 1; ta.style.height = h + "px";
    hlPaint(back, model.clean, model.ranges);
    ta.oninput = () => {
      // BULLETS: when the line you are typing starts with "* ", turn the star into a bullet "• "
      const pos = ta.selectionStart;
      const ls0 = ta.value.lastIndexOf("\n", pos - 1) + 1;          // start of the current line
      const ls = ls0 + ta.value.slice(ls0).match(/^ */)[0].length;   // ... after the indentation
      if (ta.value[ls] === "*" && ta.value[ls + 1] === " ") {
        ta.value = ta.value.slice(0, ls) + "•" + ta.value.slice(ls + 1);
        ta.setSelectionRange(pos, pos);                              // keep the cursor where it was
      }
      // CHECKBOXES: "[] " at the start of a line becomes "[ ] " (a box)
      const cm = ta.value.slice(ls).match(/^\[\] /);
      if (cm && pos === ls + 3) {
        ta.value = ta.value.slice(0, ls) + "[ ] " + ta.value.slice(ls + 3);
        ta.setSelectionRange(ls + 4, ls + 4);
      }
      sync(); ta.style.height = "auto"; ta.style.height = ta.scrollHeight + "px";
    };
    // LISTS: Enter on a bullet "• ", a box "[ ] " or a number "3. " starts the next item; Enter on an empty item ends the list.
    // "beforeinput" is used instead of "keydown" because phone keyboards do not send a reliable Enter key.
    let shiftDown = false;
    ta.onkeydown = e => {
      shiftDown = e.shiftKey;
      if ((e.ctrlKey || e.metaKey) && !e.altKey && e.key.toLowerCase() === "b") { e.preventDefault(); boldApply(ta); }   // Ctrl+B
      else if (e.key === "Tab") { e.preventDefault(); indentApply(ta, e.shiftKey ? -1 : 1); }                           // Tab / Shift+Tab
    };
    ta.onkeyup = () => { shiftDown = false; };
    ta.addEventListener("beforeinput", e => {
      if ((e.inputType !== "insertLineBreak" && e.inputType !== "insertParagraph") || shiftDown) return;   // Shift+Enter = plain line break
      const pos = ta.selectionStart, ls = ta.value.lastIndexOf("\n", pos - 1) + 1;
      const full = ta.value.slice(ls, pos), ind = full.match(/^ */)[0], line = full.slice(ind.length);   // the indentation is kept on the next line
      const num = line.match(/^(\d+)\. /);
      let pre = null;
      if (line.startsWith("• ")) pre = "• ";
      else if (line.startsWith("- ")) pre = "- ";                  // dash list
      else if (/^(\[[ xX]\]|[☐☑]) /.test(line)) pre = "[ ] ";
      else if (num) pre = (+num[1] + 1) + ". ";                    // numbering: 1. 2. 3. ...
      if (!pre) return;                                            // normal line: normal Enter
      e.preventDefault();
      if (/^(• |- |\[[ xX]\] |[☐☑] |\d+\. )$/.test(line)) ta.setRangeText("", ls, pos, "end");   // empty item -> remove it (ends the list)
      else ta.setRangeText("\n" + ind + pre, pos, ta.selectionEnd, "end");                                // continue the list
      ta.dispatchEvent(new Event("input"));                        // save + resize
    });
    ta.onblur = () => { item.text = hlSerialize(ta.value, model.ranges); activeNote = null; hideHlBar(); save(); render(); };
    const wrap = document.createElement("div"); wrap.className = "edwrap"; wrap.append(back, ta);
    body.replaceWith(wrap); activeNote = item;  // pasting an image now goes into this note
    ta.focus({ preventScroll: true });                           // do not let the browser scroll the canvas
    if (selA !== undefined) { ta.setSelectionRange(hlToClean(item.text, selA), hlToClean(item.text, selB)); setTimeout(() => updateHlBar(ta), 0); }   // text was selected before editing: keep the selection and show the colour bar at once
    else ta.setSelectionRange(caret, caret);
    bindHighlight(ta);                                           // the formatting bar (bold, indent, checkbox, highlight colours)
    setTimeout(() => updateHlBar(ta), 0);
    if (ta.scrollHeight > ta.clientHeight) ta.style.height = ta.scrollHeight + "px";   // grow only if the text really needs more room
  };
  body.onmousedown = e => { if (e.target.classList.contains("cb")) e.preventDefault(); };   // keeps the focus, so the click is never lost
  // Selecting text with the mouse (or a double click on a word) straight away opens the editor WITH that selection, so the colour bar shows at once
  body.onmouseup = () => {
    const sl = getSelection();
    if (!sl || sl.isCollapsed || sl.rangeCount === 0 || !body.contains(sl.anchorNode) || !body.contains(sl.focusNode)) return;
    const r = sl.getRangeAt(0), pre = document.createRange(); pre.setStart(body, 0); pre.setEnd(r.startContainer, r.startOffset);
    const a = pre.toString().length; edit(undefined, undefined, a, a + r.toString().length);
  };
  body.onclick = e => {
    if (activeNote === item) return;                                                            // already editing (the selection above opened the editor)
    if (e.target.classList.contains("cb")) return toggleCheck(item, +e.target.dataset.line);   // a click on a box ticks it
    if (e.target.tagName !== "A") edit(e.clientX, e.clientY);                                  // links stay clickable
  };  // links stay clickable
  el.appendChild(body);
  if (editing) setTimeout(edit, 0);
  // YouTube links in the text get a clickable thumbnail preview
  el.appendChild(makeVideos(item));
  // Images embedded inside the note (shown under the text)
  if (item.type === "note") {
    el.appendChild(makeInlineImages(item));
    el.appendChild(makeDeadline(item, el));   // premium deadline chip
  }

  // Images also get an editable link URL field
  if (item.type === "image") {
    const inp = document.createElement("input");
    inp.className = "link"; inp.placeholder = "Link URL (opens when you click the image)";
    inp.value = item.link || "";
    inp.onchange = () => { item.link = fixUrl(inp.value); save(); render(); };
    el.appendChild(inp);
  }

  // With snapping on, a resized card's width also snaps to the grid when you release the mouse
  el.addEventListener("pointerup", () => {
    if (!snapOn) return;
    const w = snapW(el.offsetWidth);
    if (w !== el.offsetWidth) { el.style.width = w + "px"; item.w = w; save(); }
  });
  // Remember width after the user resizes the card
  new ResizeObserver(() => { const w = el.offsetWidth; if (w && Math.abs(w - item.w) > 2) { item.w = w; save(); } }).observe(el);
  return el;
}

/* ---------- Images inside a note ---------- */
// Store a new image in the note, then redraw
async function addImageToNote(item, blob) {
  const img = await putImage(blob);
  item.images = item.images || [];          // older notes have no images list yet
  item.images.push({ img, link: "" });
  save(); render();
}
// Build the block of embedded images for one note
/* ---------- The "Add image" field of a note: closed by default, opens for 5 seconds ---------- */
const addUntil = {};                                    // note id -> the moment its field closes again
const addTimers = {};                                   // note id -> the timer that closes it
function setAddField(item, open) {
  clearTimeout(addTimers[item.id]);
  if (open) { addUntil[item.id] = Date.now() + 5000; addTimers[item.id] = setTimeout(() => setAddField(item, false), 5000); }
  else delete addUntil[item.id];
  // Only this note's card is updated (a full redraw would interrupt typing in other notes)
  const card = board.querySelector('.card[data-id="' + item.id + '"]');
  if (!card) return;
  const tile = card.querySelector(".addpic"), tg = card.querySelector(".addtoggle");
  if (!tile || !tg) return;
  tile.classList.toggle("closed", !open); tg.classList.toggle("on", open);
  if (open) {                                           // restart the shrinking countdown line
    const bar = tile.querySelector("i");
    bar.style.animation = "none"; void bar.offsetWidth; bar.style.animation = ""; bar.style.animationDuration = "5000ms";
  }
}

// Icons (inline SVG, drawn with the text color)
